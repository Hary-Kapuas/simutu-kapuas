  out.push(anF('IKP','info','Ringkasan insiden ('+rng+')','Terdapat '+inc.length+' insiden dilaporkan. Sebaran jenis: '+Object.keys(byJenis).map(k=>k+' '+byJenis[k]).join(', ')+'. Unit terbanyak: '+Object.keys(byUnit).sort((a,b)=>byUnit[b]-byUnit[a]).slice(0,3).map(u=>u+' ('+byUnit[u]+')').join(', ')+'.',[],
    [anA('Bahas rekap insiden bulanan di lokmin dan catat pembelajaran serta perbaikan yang disepakati','Tim Mutu',30,'Rekap terbahas; pembelajaran terdokumentasi')]));
  if(high.length){
    out.push(anF('IKP','high','Insiden grading tinggi/ekstrem: '+high.length+' kejadian','Insiden grading High/Extreme: '+anTop(high,5).map(x=>x.tanggal+' ('+(x.unit||'-')+': '+String(x.deskripsi||'').substring(0,70)+')').join('; ')+'.',[],
      [anA('Lakukan investigasi/analisis akar masalah (RCA) terhadap insiden grading tinggi/ekstrem bersama tim mutu dan unit terkait; dokumentasikan hasilnya','Tim Mutu + kepala unit',14,'Laporan RCA tersusun; tindakan pencegahan ditetapkan'),
       anA('Laporkan insiden grading tinggi/ekstrem kepada Kepala Puskesmas/Klinik dan Dinkes sesuai pedoman pelaporan','PJ Mutu',2,'Laporan diterima Kepala dan Dinkes'),
       anA('Tetapkan dan pantau tindakan pencegahan agar kejadian serupa tidak berulang; evaluasi efektivitasnya di lokmin','Tim Mutu',30,'Tidak ada kejadian serupa pada 3 bulan berikutnya')]));
  }
  if(harm.length){
    out.push(anF('IKP', harm.some(x=>code(x)==='Sentinel')?'high':'mid','Insiden yang mengenai pasien (KTD/Sentinel): '+harm.length+' kejadian','Terdapat '+harm.length+' insiden yang sampai mengenai pasien ('+anTop(harm,5).map(x=>x.tanggal+' '+code(x)+' di '+(x.unit||'-')).join('; ')+').',[],
      [anA('Pastikan pasien/keluarga mendapat penjelasan yang terbuka dan tindak lanjut pelayanan sesuai pedoman keselamatan pasien','Kepala / dokter penanggung jawab',3,'Penjelasan tercatat'),
       anA('Telaah sistem (bukan menyalahkan individu) untuk menemukan perbaikan alur/SOP','Tim Mutu',14,'Perbaikan alur/SOP ditetapkan')]));
  }
  Object.keys(byUnit).filter(u=>byUnit[u]>=3).forEach(u=>{
    out.push(anF('IKP','mid','Insiden berulang di unit '+u+' ('+byUnit[u]+' kejadian)','Unit "'+u+'" melaporkan '+byUnit[u]+' insiden pada '+rng+', mengindikasikan pola yang perlu ditelaah.',[],
      [anA('Telaah pola insiden berulang di unit '+u+' (jenis, waktu, penyebab) dan perbaiki alur/SOP/sarana di unit tersebut','Kepala unit + Tim Mutu',14,'Pola teridentifikasi; perbaikan dilaksanakan')]));
  });
  return out;
}

/* ---------- PPI ---------- */
function analyzePpi(d){
  const w = anWindow(d.period), out = [];
  const chk = (d.rec.checklist||[]).filter(c=>c.period>=w.startPeriod && c.period<=w.endPeriod);
  const rng = periodLabel(w.startPeriod)+' – '+periodLabel(w.endPeriod);
  if(chk.length===0){
    out.push(anF('PPI','info','Daftar tilik PPI belum diisi ('+rng+')','Belum ada daftar tilik PPI pada '+rng+'.',[],[anA('Lakukan penilaian daftar tilik PPI di setiap ruang dan input ke aplikasi','Tim PPI',14,'Daftar tilik seluruh ruang terisi')]));
  } else {
    const latest = {}; chk.forEach(c=>{ const k = c.ruang||'-'; if(!latest[k] || c.period>latest[k].period) latest[k] = c; });
    let allGood = true;
    Object.keys(latest).forEach(r=>{
      const c = latest[r];
      if(c.kategori==='Baik' || c.kategori==='Sangat Baik') return;
      allGood = false;
      const level = (c.kategori==='Kurang' || c.kategori==='Sangat Kurang') ? 'high' : 'mid';
      const fails = Object.keys(c.items||{}).filter(k=>Number(c.items[k])<=2);
      const byCat = {}; fails.forEach(k=>{ const parts = k.split(' — '); const cat = parts[0], it = parts.slice(1).join(' — '); (byCat[cat] = byCat[cat]||[]).push(it); });
      const rtl = Object.keys(byCat).map(cat=>{ const h = PPI_CAT_HINT[cat]; return anA((h?h[0]:'Perbaiki kategori '+cat)+' — butir: '+byCat[cat].join('; ')+' (ruang '+r+')', h?h[1]:'Tim PPI', h?h[2]:14, 'Butir terpenuhi; skor kategori naik pada penilaian berikutnya'); });
      if(!rtl.length) rtl.push(anA('Tinjau hasil penilaian ruang '+r+' dan tetapkan perbaikan pada butir dengan nilai terendah','Tim PPI',14,'Skor ruang naik pada penilaian berikutnya'));
      out.push(anF('PPI', level, 'Daftar tilik ruang '+r+': '+fmtPct(c.skor)+' ('+c.kategori+')', 'Ruang '+r+' pada '+periodLabel(c.period)+' memperoleh skor '+fmtPct(c.skor)+' dengan kategori '+c.kategori+'.'+(fails.length?' Butir bernilai rendah: '+fails.map(k=>k.replace(' — ',': ')).join('; ')+'.':''), [], rtl));
    });
    if(allGood) out.push(anF('PPI','ok','Daftar tilik PPI baik','Seluruh ruang yang dinilai pada '+rng+' berkategori Baik/Sangat Baik.',[],[anA('Pertahankan penilaian berkala dan libatkan petugas dalam perbaikan berkelanjutan','Tim PPI',30,'Kategori tetap Baik/Sangat Baik')]));
  }
  const aud = (d.rec.ppiAudit||[]).filter(a=>a.tanggal>=w.start && a.tanggal<=w.end);
  if(aud.length===0){
    out.push(anF('PPI','info','Audit kualitas PPI belum dilakukan ('+rng+')','Belum ada audit kualitas PPI pada '+rng+'.',[],[anA('Lakukan audit kualitas PPI (praktik infus/tindakan invasif) di ruang terkait dan input hasilnya','Tim PPI',30,'Audit terlaksana dan terinput')]));
  } else {
    const q = {};
    aud.forEach(a=>(a.answers||[]).forEach(x=>{ if(x.jawaban==='T'||x.jawaban==='K'){ const k = x.pertanyaan; q[k] = q[k]||{t:0,k:0,alasan:[]}; if(x.jawaban==='T') q[k].t++; else q[k].k++; if(x.alasan && q[k].alasan.indexOf(x.alasan)<0) q[k].alasan.push(x.alasan); } }));
    const keys = Object.keys(q).sort((a,b)=>(q[b].t*2+q[b].k)-(q[a].t*2+q[a].k));
    if(keys.length===0){
      out.push(anF('PPI','ok','Audit kualitas PPI sesuai','Seluruh audit pada '+rng+' menjawab "Ya" untuk semua pertanyaan.',[],[anA('Pertahankan praktik dan lakukan audit berkala','Tim PPI',30,'Hasil audit tetap sesuai')]));
    } else {
      const level = keys.some(k=>q[k].t>=2) ? 'high' : 'mid';
      out.push(anF('PPI', level, 'Audit kualitas PPI: '+keys.length+' praktik belum sesuai', 'Praktik dengan jawaban "Tidak/Kadang-kadang": '+anTop(keys,5).map(k=>'"'+k+'" (Tidak '+q[k].t+', Kadang '+q[k].k+')').join('; ')+'.', [],
        anTop(keys,6).map(k=>anA('Tindak lanjuti praktik: "'+k+'" (Tidak '+q[k].t+'×, Kadang-kadang '+q[k].k+'×'+(q[k].alasan.length?'; alasan tercatat: '+q[k].alasan.join(', '):'')+')','Kepala ruang / Tim PPI',14,'Praktik dilakukan konsisten pada audit berikutnya'))));
    }
  }
  const paj = (d.rec.pajanan||[]).filter(x=>x.tanggalLaporan>=w.start && x.tanggalLaporan<=w.end);
  if(paj.length){
    const noHep = paj.filter(x=>x.imunisasiHepB==='Belum'), noApd = paj.filter(x=>x.alatPelindung==='Tidak'), noP3k = paj.filter(x=>x.pertolonganPertama==='Tidak'), noMon = paj.filter(x=>!String(x.pemantauanPajanan||'').trim());
    const level = (noHep.length||noApd.length||noP3k.length||noMon.length) ? 'high' : 'mid';
    const rtl = [];
    if(noHep.length) rtl.push(anA('Lengkapi imunisasi Hepatitis B bagi petugas yang belum mendapatkannya','Kepala Puskesmas/Klinik + Tim PPI',30,'Seluruh petugas berisiko terimunisasi'));
    rtl.push(anA('Tinjau setiap kejadian pajanan (kronologi, alat, penggunaan APD) dan perbaiki praktik/alat (mis. safety box, alat tajam dengan pengaman)','Tim PPI',14,'Perbaikan praktik/alat ditetapkan'));
    if(noMon.length) rtl.push(anA('Pastikan pemantauan pasca-pajanan terdokumentasi dan petugas terpajan mendapat tindak lanjut sesuai protokol/SOP pajanan','Tim PPI / dokter',7,'Seluruh kasus pajanan memiliki catatan pemantauan'));
    rtl.push(anA('Sosialisasi ulang alur pelaporan dan penanganan pertama pajanan kepada seluruh petugas','Tim PPI',14,'Petugas memahami alur; laporan tepat waktu'));
    out.push(anF('PPI', level, 'Laporan pajanan: '+paj.length+' kejadian ('+rng+')', 'Terdapat '+paj.length+' laporan pajanan pada '+rng+'.'+(noHep.length?' '+noHep.length+' belum imunisasi Hepatitis B.':'')+(noApd.length?' '+noApd.length+' tidak memakai alat pelindung.':'')+(noP3k.length?' '+noP3k.length+' tanpa pertolongan pertama.':'')+(noMon.length?' '+noMon.length+' belum memiliki catatan pemantauan pajanan.':''), [], rtl));
  }
  return out;
}

/* ---------- Audit Internal ---------- */
function analyzeAudit(d){
  const w = anWindow(d.period), out = [], today = todayISO(), year = String(d.period).split('-')[0];
  const f1 = (d.rec.auditForm1||[]).filter(x=>x.tanggal>=w.start && x.tanggal<=w.end && (x.kategori==='Kurang'||x.kategori==='Cukup'));
  f1.sort((a,b)=>(b.persentase||0)-(a.persentase||0));
  if(f1.length){
    out.push(anF('Audit Internal', f1.some(x=>x.kategori==='Kurang')?'high':'mid', 'Hasil audit indikator: '+f1.length+' indikator perlu perbaikan', 'Indikator dengan ketidaksesuaian tinggi: '+anTop(f1,5).map(x=>'"'+x.indikator+'" ('+x.persentase+'% — '+x.kategori+')').join('; ')+'.', [],
      anTop(f1,5).map(x=>anA('Tinjau proses terkait "'+x.indikator+'" (ketidaksesuaian '+x.persentase+'%), tetapkan tindakan koreksi dan batas waktu','Auditee / kepala unit',14,'Audit ulang menunjukkan ketidaksesuaian menurun'))));
  }
  const open = (d.rec.temuan||[]).filter(x=>x.status==='Belum Selesai');
  const overdue = open.filter(x=>x.batasWaktu && x.batasWaktu<today);
  if(overdue.length){
    out.push(anF('Audit Internal','high','Temuan audit melewati batas waktu: '+overdue.length,'Temuan yang belum selesai dan telah melewati batas waktu: '+anTop(overdue,5).map(x=>'"'+String(x.temuan||'').substring(0,60)+'" (batas '+x.batasWaktu+')').join('; ')+'.',[],
      [anA('Selesaikan atau jadwalkan ulang temuan yang melewati batas waktu; catat alasan keterlambatan dan rencana tindak lanjut','Auditee + PJ Mutu',7,'Temuan selesai atau memiliki jadwal baru yang disepakati')]));
  }
  const rest = open.filter(x=>overdue.indexOf(x)<0);
  if(rest.length){
    const noKoreksi = rest.filter(x=>!String(x.tindakanKoreksi||'').trim());
    const rtl = [anA('Pastikan tindakan koreksi/pencegahan, penanggung jawab, dan tenggat jelas untuk setiap temuan; verifikasi efektivitas setelah selesai','PJ Mutu + auditee',14,'Semua temuan memiliki rencana dan tenggat')];
    if(noKoreksi.length) rtl.unshift(anA('Isi tindakan koreksi pada temuan: '+anTop(noKoreksi,4).map(x=>'"'+String(x.temuan||'').substring(0,50)+'"').join('; '),'Auditee',7,'Tindakan koreksi terisi'));
    out.push(anF('Audit Internal','mid','Temuan audit belum selesai: '+rest.length,'Terdapat '+rest.length+' temuan yang belum selesai (belum melewati batas waktu).'+(noKoreksi.length?' '+noKoreksi.length+' di antaranya belum memiliki tindakan koreksi.':''),[],rtl));
  }
  if(!d.jadwal){
    out.push(anF('Audit Internal','info','Jadwal audit internal '+year+' belum disusun','Jadwal audit internal tahun '+year+' belum tersedia di aplikasi.',[],[anA('Susun jadwal audit internal tahun '+year+' per klaster dan tetapkan tim audit','PJ Mutu / Tim Audit',30,'Jadwal dan tim audit tersimpan')]));
  }
  if(!out.length && ((d.rec.temuan||[]).length || (d.rec.auditForm1||[]).length)) out.push(anF('Audit Internal','ok','Audit internal terkendali','Tidak ada temuan terbuka yang melewati batas waktu dan tidak ada indikator audit berkategori Kurang/Cukup pada periode ini.',[],[anA('Pertahankan pelaksanaan audit sesuai jadwal dan verifikasi efektivitas tindakan koreksi','PJ Mutu',30,'Audit sesuai jadwal')]));
  return out;
}

/* ---------- Manajemen Risiko ---------- */
function analyzeRisk(d){
  const out = [], reg = d.rec.riskReg||[], prof = d.rec.riskProfil||[], pem = d.rec.riskPem||[];
  if(reg.length===0){
    out.push(anF('Manajemen Risiko','info','Register risiko belum disusun','Belum ada risiko yang tercatat pada register.',[],[anA('Identifikasi dan catat risiko utama (klinis dan non-klinis) pada Register Risiko','PJ Mutu + Tim Mutu',30,'Register risiko tersusun')]));
    return out;
  }
  const high = reg.filter(r=>r.tingkat==='Tinggi'||r.tingkat==='Sangat Tinggi');
  const noProf = high.filter(r=>!prof.some(p=>p.kodeRisiko===r.kodeRisiko));
  if(noProf.length) out.push(anF('Manajemen Risiko','high','Risiko tinggi tanpa rencana penanganan: '+noProf.length,'Risiko tingkat Tinggi/Sangat Tinggi yang belum memiliki Profil Risiko: '+anTop(noProf,5).map(r=>r.kodeRisiko+' ('+String(r.risiko||'').substring(0,50)+')').join('; ')+'.',[],
    anTop(noProf,5).map(r=>anA('Susun Profil Risiko dan rencana penanganan (opsi, biaya, waktu, target residual) untuk risiko '+r.kodeRisiko,'Penanggung jawab risiko + PJ Mutu',14,'Profil risiko tersimpan'))));
  const perlu = reg.filter(r=>r.perluPenanganan==='Ya' && (r.tingkat==='Rendah'||r.tingkat==='Sedang') && !prof.some(p=>p.kodeRisiko===r.kodeRisiko));
  if(perlu.length) out.push(anF('Manajemen Risiko','mid','Risiko ditandai perlu penanganan tanpa rencana: '+perlu.length,'Risiko yang ditandai "perlu penanganan" tetapi belum memiliki Profil Risiko: '+anTop(perlu,5).map(r=>r.kodeRisiko).join(', ')+'.',[],
    [anA('Lengkapi Profil Risiko untuk risiko yang ditandai perlu penanganan','PJ Mutu',30,'Profil risiko tersimpan')]));
  const noPem = prof.filter(p=>!pem.some(x=>x.kodeRisiko===p.kodeRisiko));
  if(noPem.length) out.push(anF('Manajemen Risiko','mid','Rencana penanganan belum dipantau: '+noPem.length,'Profil risiko tanpa catatan pemantauan: '+anTop(noPem,5).map(p=>p.kodeRisiko).join(', ')+'.',[],
    [anA('Catat pemantauan dan peninjauan penanganan risiko (realisasi, hambatan, risiko residual)','PJ Mutu + penanggung jawab risiko',30,'Pemantauan tercatat')]));
  const latest = {}; pem.forEach(x=>{ const t = tsToDate(x.createdAt); const k = x.kodeRisiko; if(!latest[k] || (t && tsToDate(latest[k].createdAt) && t>tsToDate(latest[k].createdAt))) latest[k] = x; });
  const worse = Object.keys(latest).map(k=>latest[k]).filter(x=>x.residualTingkat==='Tinggi'||x.residualTingkat==='Sangat Tinggi'||x.trendRisiko==='Naik');
  if(worse.length) out.push(anF('Manajemen Risiko','high','Risiko residual masih tinggi/meningkat: '+worse.length,'Risiko dengan residual Tinggi/Sangat Tinggi atau tren naik: '+anTop(worse,5).map(x=>x.kodeRisiko+' ('+(x.residualTingkat||'-')+', tren '+(x.trendRisiko||'-')+')').join('; ')+'.',[],
    anTop(worse,4).map(x=>anA('Evaluasi efektivitas penanganan risiko '+x.kodeRisiko+'; pertimbangkan opsi penanganan lain atau eskalasi ke pimpinan','PJ Mutu + Kepala',14,'Keputusan penanganan lanjutan tercatat'))));
  if(!out.length) out.push(anF('Manajemen Risiko','ok','Pengelolaan risiko terkendali','Risiko tinggi telah memiliki rencana penanganan dan tidak ditemukan risiko residual yang meningkat.',[],[anA('Tinjau register risiko secara berkala dan perbarui bila ada perubahan kondisi','PJ Mutu',60,'Register diperbarui')]));
  return out;
}

/* ---------- MFK & K3 ---------- */
function analyzeMfk(d){

  const reg = d.rec.mfk||[];
  const st = reg.filter(r=>r.tingkat==='Sangat Tinggi');

      anTop(st,5).map(r=>anA((blank.indexOf(r)>=0?'Tetapkan/lengkapi pencegahan dan upaya penanganan':'Tinjau efektivitas pengendalian')+' risiko "'+String(r.risiko||'').substring(0,50)+'" (unit '+(r.unitKerja||'-')+') dan tunjuk penanggung jawab','Penanggung jawab MFK + Kepala',14,'Pengendalian ditetapkan/ditinjau'))));

  if((d.rec.k3pem||[]).length===0) out.push(anF('MFK & K3','info','Pemetaan risiko K3 belum dilakukan','Belum ada pemetaan risiko K3 (fisik, kimia, biologi, ergonomi, psikososial).',[],[anA('Lakukan pemetaan risiko K3 per ruang pelayanan dan input ke aplikasi','Tim K3',30,'Pemetaan seluruh ruang tersimpan')]));
  if((d.rec.k3rn||[]).length===0) out.push(anF('MFK & K3','info','Perencanaan K3 belum disusun','Belum ada rencana kegiatan K3.',[],[anA('Susun rencana kegiatan K3 tahun '+year+' (kegiatan, target, anggaran, indikator)','Tim K3',30,'Rencana K3 tersimpan')]));
  const b3 = (d.rec.b3||[]).filter(x=>x.bulan>=w.startPeriod && x.bulan<=w.endPeriod);
  if(b3.length===0) out.push(anF('MFK & K3','info','Inventaris B3 belum diisi ('+periodLabel(w.startPeriod)+' – '+periodLabel(w.endPeriod)+')','Belum ada inventaris bahan berbahaya dan beracun (B3) pada periode ini.',[],[anA('Lengkapi inventaris B3 bulan '+periodLabel(d.period),'Petugas B3 / farmasi / lab',7,'Inventaris B3 terisi')]));
  else {
    const bad = b3.filter(x=>x.msds==='Tidak' || x.label==='Tidak');
    if(bad.length){
      const uniq = {}; bad.forEach(x=>{ uniq[(x.namaBahan||'-')+'|'+(x.ruangan||'-')] = x; });
      const list = Object.keys(uniq).map(k=>uniq[k]);
      out.push(anF('MFK & K3','high','Bahan B3 tanpa MSDS/label: '+list.length,'Bahan B3 tanpa MSDS atau label: '+anTop(list,6).map(x=>(x.namaBahan||'-')+' ('+(x.ruangan||'-')+')').join('; ')+'.',[],
        anTop(list,6).map(x=>anA('Lengkapi MSDS dan label untuk bahan "'+(x.namaBahan||'-')+'" di '+(x.ruangan||'-'),'Petugas B3 / farmasi / lab',7,'MSDS dan label lengkap'))));
    } else out.push(anF('MFK & K3','ok','Inventaris B3 lengkap','Seluruh bahan B3 pada periode ini memiliki MSDS dan label.',[],[anA('Pertahankan kelengkapan MSDS/label dan perbarui inventaris tiap bulan','Petugas B3',30,'Inventaris selalu diperbarui')]));
  }
  return out;
}

/* ---------- Kepatuhan pelaporan ---------- */
function analyzeKepatuhan(d){
  const out = [], cur = d.inm.cur;

  const act = anA('Terapkan pengingat internal (mis. 3 hari sebelum batas) dan tunjuk PJ cadangan agar laporan selalu tepat waktu','PJ Mutu + Kepala',7,'Laporan berikutnya tepat waktu');

/* ---------- Penyusun analisis ---------- */
function buildKesimpulan(d, findings, stats){
  const paras = [], pl = periodLabel(d.period);
  if(stats.filled===0) paras.push('Data INM '+pl+' belum diisi sehingga capaian mutu belum dapat dinilai. Segera lengkapi input INM agar analisis dapat disusun.');
  else {
    const bl = stats.below.slice().sort((a,b)=>b.gap-a.gap).map(x=>x.short+' '+fmtPct(x.p)+' (target '+x.t+'%)');
    paras.push('Pada '+pl+', '+stats.achieved+' dari '+stats.filled+' indikator INM yang terisi telah mencapai target'+(bl.length?'; '+bl.length+' belum mencapai target, yaitu '+bl.join('; '):'; seluruh indikator terisi memenuhi target')+'.');
  }
  const others = findings.filter(f=>f.modul!=='INM' && f.level==='high');
  const cnt = {}; others.forEach(f=>{ cnt[f.modul] = (cnt[f.modul]||0)+1; });
  paras.push(others.length ? 'Di luar INM, terdapat '+others.length+' hal berprioritas tinggi pada: '+Object.keys(cnt).map(m=>m+' ('+cnt[m]+')').join(', ')+'.' : 'Di luar INM, tidak ditemukan hal berprioritas tinggi berdasarkan data yang diinput.');
  const top = findings.filter(f=>f.level==='high').concat(findings.filter(f=>f.level==='mid')).slice(0,3);
  if(top.length) paras.push('Prioritas utama tindak lanjut: '+top.map((f,i)=>(i+1)+') '+f.judul).join('; ')+'.');
  paras.push('Panduan: laksanakan tindak lanjut bertahap dengan siklus PDCA — mulai dari usulan berprioritas tinggi dan berjangka pendek, tetapkan penanggung jawab dan tenggat, bahas progres pada lokmin bulanan, lalu evaluasi capaian pada periode berikutnya.');
  return paras;
}
function buildAnalysis(d){
  const inm = analyzeInm(d);
  const findings = [].concat(inm.findings, analyzePmp(d), analyzeIkp(d), analyzePpi(d), analyzeAudit(d), analyzeRisk(d), analyzeMfk(d), analyzeKepatuhan(d));
  findings.sort((a,b)=> (AN_LEVEL[a.level].order-AN_LEVEL[b.level].order) || (AN_MODUL_ORDER.indexOf(a.modul)-AN_MODUL_ORDER.indexOf(b.modul)));
  const counts = {high:0, mid:0, info:0, ok:0}; findings.forEach(f=>{ counts[f.level]++; });
  const rtl = []; const seen = {};
  findings.forEach(f=>{
    if(f.level==='ok' || f.level==='info' && !f.rtl.length) return;
    f.rtl.forEach(a=>{ const key = f.modul+'|'+a.k; if(seen[key]) return; seen[key] = 1; rtl.push({level:f.level, modul:f.modul, temuan:f.judul, k:a.k, pj:a.pj, hari:a.hari, ukuran:a.ukuran}); });
  });
  rtl.sort((a,b)=> (AN_LEVEL[a.level].order-AN_LEVEL[b.level].order) || (a.hari-b.hari));
  return {findings, counts, rtl, kesimpulan:buildKesimpulan(d, findings, inm.stats), stats:inm.stats};
}

/* ---------- Analisis tingkat kabupaten (INM) untuk Dinkes ---------- */
function analyzeKabupatenInm(rows){
  return inmEffectiveIndicators(STATE.period).map(ind=>{
    const t = getTarget(ind.id);
    const vals = rows.filter(r=>r.values[ind.id]!==null && r.values[ind.id]!==undefined).map(r=>({name:r.name, p:r.values[ind.id]}));
    const n = vals.length, avg = n ? vals.reduce((a,b)=>a+b.p,0)/n : null;
    const below = vals.filter(v=>v.p<t).sort((a,b)=>a.p-b.p);
    const missing = rows.filter(r=>r.values[ind.id]===null || r.values[ind.id]===undefined).map(r=>r.name);
    const level = n===0 ? 'info' : (below.length===0 ? 'ok' : ((below.length/n>=0.5 || avg<t*0.85) ? 'high' : 'mid'));
    const teks = n===0 ? 'Belum ada fasilitas yang melaporkan.' : (n-below.length)+' dari '+n+' fasilitas pelapor mencapai target ('+t+'%); rata-rata '+fmtPct(avg)+'.'+(missing.length?' '+missing.length+' fasilitas belum melapor.':'');
    const rtl = (level==='ok' || n===0) ? 'Pertahankan; apresiasi dan bagikan praktik baik fasilitas berkinerja tinggi' : INM_KB[ind.id].dinkes+(below.length?': '+anTop(below,5).map(b=>b.name).join(', '):'');
    return {ind, target:t, n, avg, below, missing, level, teks, rtl};
  });
}
function anKabupatenHtml(rows){
  const body = rows.map(r=>`<tr>
    <td style="font-weight:600; white-space:normal; min-width:170px;">${esc(r.ind.name)}</td>
    <td>${r.avg===null?'—':fmtPct(r.avg)}<div style="font-size:11px; color:var(--ink-soft);">target ${r.target}%</div></td>
    <td>${r.n?(r.n-r.below.length)+' / '+r.n:'—'}</td>
    <td style="white-space:normal; min-width:200px;">${r.below.length?anTop(r.below,5).map(b=>esc(b.name)+' ('+fmtPct(b.p)+')').join(', '):'—'}${r.missing.length?`<div style="font-size:11px; color:var(--ink-soft); margin-top:3px;">Belum lapor: ${r.missing.length} fasilitas</div>`:''}</td>
    <td><span class="pill ${AN_LEVEL[r.level].cls}">${AN_LEVEL[r.level].label}</span></td>
    <td style="white-space:normal; min-width:240px;">${esc(r.rtl)}</td></tr>`).join('');
  return `<div class="card scrollx" style="padding:4px;" id="analisis-kab"><table>
    <thead><tr><th>Indikator</th><th>Rata-rata</th><th>Fasilitas Mencapai Target</th><th>Fasilitas Prioritas (terendah)</th><th>Status</th><th>Tindak Lanjut Dinkes (usulan)</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ---------- Pemuatan data & tampilan ---------- */
async function loadAnalysisData(facilityId, period){
  const year = period.split('-')[0], prevs = anPrevPeriods(period, 3);
  const fdoc = (coll, id)=>db.collection(coll).doc(id).get().then(s=>s.exists?s.data():null);
  const colls = {ikp:'ikp_reports', pajanan:'ppi_pajanan', checklist:'ppi_checklist', ppiAudit:'ppi_audit', auditForm1:'audit_form1', temuan:'audit_temuan',
    riskReg:'risk_register', riskProfil:'risk_profil', riskPem:'risk_pemantauan', mfk:'mfk_register', k3pem:'k3_pemetaan', k3rn:'k3_perencanaan', b3:'k3_b3'};
  const keys = Object.keys(colls);
  const [inmCur, inmPrev, unitCur, unitPrev, fasCur, fasPrev, jadwal, itemsSnap, recs] = await Promise.all([
    fdoc('inm_reports', facilityId+'_'+period),
    Promise.all(prevs.map(p=>fdoc('inm_reports', facilityId+'_'+p).then(x=>({period:p, data:x})))),
    fdoc('pmp_reports', facilityId+'_'+period),
    Promise.all(prevs.map(p=>fdoc('pmp_reports', facilityId+'_'+p).then(x=>({period:p, data:x})))),
    fdoc('pmp_reports', facilityId+'_'+year),
    fdoc('pmp_reports', facilityId+'_'+(Number(year)-1)),
    fdoc('audit_jadwal', facilityId+'_'+year),
    db.collection('pmp_indicators').doc(facilityId).collection('items').get(),
    Promise.all(keys.map(k=>db.collection(colls[k]).where('facilityId','==',facilityId).get()))
  ]);
  const rec = {}; keys.forEach((k,i)=>{ rec[k] = recs[i].docs.map(x=>({id:x.id, ...x.data()})); });
  return {period, year, facility:STATE.facilities.find(f=>f.id===facilityId)||null,
    inm:{cur:inmCur, prev:inmPrev}, pmp:{items:itemsSnap.docs.map(x=>({id:x.id, ...x.data()})), unitCur, unitPrev, fasCur, fasPrev}, rec, jadwal};
}

      <p style="font-size:11.5px; color:var(--ink-soft); margin:12px 0 0;">Dokumen ini disusun otomatis berdasarkan data yang diinput dan aturan analisis baku; sesuaikan penanggung jawab dan tenggat dengan kondisi ${esc(facLbl||'fasilitas')} setelah dibahas bersama tim.</p>
    </div>

async function runAnalysis(facilityId, period, bodyId){
  const el = document.getElementById(bodyId); if(!el) return;
  try{
    const data = await loadAnalysisData(facilityId, period);
    const res = buildAnalysis(data);
    const el2 = document.getElementById(bodyId); if(!el2) return;
    el2.innerHTML = renderAnalysisHtml(res, data);
  }catch(e){
    const el2 = document.getElementById(bodyId);
    if(el2) el2.innerHTML = `<div class="card" style="padding:18px; color:var(--rust);">Gagal menyusun analisis: ${esc(e.message)}</div>`;
  }
}

    ${!isSemesterMonth(STATE.period)?`<p style="font-size:12px; color:var(--ink-soft); margin:-4px 0 10px;">Kepuasan Pengguna Layanan tidak ditampilkan bulan ini — indikator tersebut hanya wajib dilaporkan tiap Juni &amp; Desember (semester).</p>`:''}
    ${kab}
    ${ringkasanData ? printExportToolbar('Analisis INM Tingkat Kabupaten', periodLabel(STATE.period), '#analisis-kab', 'Analisis_INM_Kabupaten_'+STATE.period+'.xlsx', null, periodLabel(STATE.period)) : ''}
    <h3 class="serif" style="margin:22px 0 10px; font-size:16px;">Analisis per Fasilitas</h3>
    <div style="margin-bottom:10px;"><select style="width:auto; min-width:240px;" onchange="STATE.selectedFacilityId=this.value; renderDinkesShell();">${opts}</select></div>
    ${printExportToolbar('Analisis dan Rencana Tindak Lanjut', periodLabel(STATE.period), '#analisis-print', 'RTL_'+STATE.period+'.xlsx', fid, periodLabel(STATE.period))}
    <div id="analisis-body"><div class="spinner"></div></div>`;
  if(fid) setTimeout(()=>runAnalysis(fid, STATE.period, 'analisis-body'), 30);
  return ['Analisis & Rencana Tindak Lanjut', 'Analisis otomatis tingkat kabupaten dan per fasilitas', content];
}


/* =====================================================================
   PEMBARUAN V5 — Tanggal cetak dapat ditentukan pengguna (mis. cetak mundur/backdate)
   ===================================================================== */
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getPrintDate(){ return /^\d{4}-\d{2}-\d{2}$/.test(STATE.printDate||'') ? STATE.printDate : todayISO(); }
function printDateObj(){ const p = getPrintDate().split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function printDateLabel(){ return fmtDateID(printDateObj()); }
function hariText(h){ const d = printDateObj(); d.setDate(d.getDate()+h); return '≤ '+h+' hari (s.d. '+fmtDateID(d)+')'; }
function setPrintDate(v){
  STATE.printDate = /^\d{4}-\d{2}-\d{2}$/.test(v||'') ? v : todayISO();
  document.querySelectorAll('.print-date-input').forEach(i=>{ if(i.value!==STATE.printDate) i.value = STATE.printDate; });
  document.querySelectorAll('.rtl-hari').forEach(e=>{ e.textContent = hariText(Number(e.getAttribute('data-h'))); });
}
function printDateControl(){
  return `<label class="no-print" style="margin:0; display:flex; align-items:center; gap:6px; font-size:12.5px;">Tanggal cetak
    <input type="date" class="print-date-input" value="${getPrintDate()}" onchange="setPrintDate(this.value)" style="width:auto; padding:5px 8px; font-size:12.5px;">
    <button type="button" class="btn btn-ghost" style="padding:3px 8px; font-size:11.5px;" title="Kembalikan ke tanggal hari ini" onclick="setPrintDate('')">Hari ini</button></label>`;
}
function printExportToolbar(title, subtitle, containerSelector, filename, facilityId, period){
  const fid = facilityId ? `'${facilityId}'` : 'null';
  const per = period ? `'${esc(period)}'` : 'null';
  return `<div class="no-print" style="display:flex; gap:8px; margin:10px 0 16px; flex-wrap:wrap; align-items:center;">
    ${printDateControl()}
    <button class="btn btn-secondary" style="padding:6px 12px; font-size:12.5px;" onclick="printVisibleSection('${esc(title)}','${esc(subtitle||'')}','${containerSelector}',${fid},${per})">🖶 Cetak Laporan</button>
    <button class="btn btn-secondary" style="padding:6px 12px; font-size:12.5px;" onclick="exportVisibleTable('${esc(filename)}','${containerSelector}','${esc(title)}')">⤓ Ekspor Excel</button>
  </div>`;
}
function printSignatureBlock(fac, pjName, pjNip, isDinkesRecap){
  const today = printDateLabel();
  if(isDinkesRecap){
    const kd = STATE.kepalaDinas || {};
    const namaKd = kd.nama ? esc(kd.nama) : '(...........................................)';
    const nipKd = kd.nip ? esc(kd.nip) : '..............................';
    const namaPj = kd.pjMutuNama ? esc(kd.pjMutuNama) : '(...........................................)';
    const nipPj = kd.pjMutuNip ? esc(kd.pjMutuNip) : '..............................';
    return `<div style="display:flex; justify-content:space-between; margin-top:50px; font-size:12.5px; font-family:'Manrope',sans-serif;">
      <div style="text-align:center; width:280px;">
        <div>Mengetahui,</div>
        <div>Kepala Dinas Kesehatan Kabupaten Kapuas</div>
        <div style="height:70px;"></div>
        <div style="font-weight:700; text-decoration:underline;">${namaKd}</div>
        <div>NIP. ${nipKd}</div>
      </div>
      <div style="text-align:center; width:280px;">
        <div>Kapuas, ${today}</div>
        <div>Penanggung Jawab Mutu Dinas Kesehatan Kabupaten Kapuas</div>
        <div style="height:70px;"></div>
        <div style="font-weight:700; text-decoration:underline;">${namaPj}</div>
        <div>NIP. ${nipPj}</div>
      </div>
    </div>`;
  }
  const facilityName = fac ? fac.name : '';
  const jenisFasilitas = facilityTypeLabel(fac && fac.type) || 'Puskesmas/Klinik';
  const kepalaNama = (fac && fac.kepalaNama) ? fac.kepalaNama : '(...........................................)';
  const kepalaNip = (fac && fac.kepalaNip) ? fac.kepalaNip : '..............................';
  const pjNama = pjName || '(...........................................)';
  const pjNipVal = pjNip || '..............................';
  const lokasi = (fac && extractDesaFromAlamat(fac.alamat)) || facilityName || '';
  return `<div style="display:flex; justify-content:space-between; margin-top:50px; font-size:12.5px; font-family:'Manrope',sans-serif;">
    <div style="text-align:center; width:260px;">
      <div>Mengetahui,</div>
      <div>Kepala ${esc(jenisFasilitas)} ${esc(toTitleCase(facilityName))}</div>
      <div style="height:70px;"></div>
      <div style="font-weight:700; text-decoration:underline;">${esc(kepalaNama)}</div>
      <div>NIP. ${esc(kepalaNip)}</div>
    </div>
    <div style="text-align:center; width:260px;">
      <div>${esc(lokasi)}, ${today}</div>
      <div>Penanggung Jawab Mutu</div>
      <div style="height:70px;"></div>
      <div style="font-weight:700; text-decoration:underline;">${esc(pjNama)}</div>
      <div>NIP. ${esc(pjNipVal)}</div>
    </div>
  </div>`;
}
/* Ambil nama kelurahan/desa dari teks alamat bebas, mis. "Jl. X Kel. Selat Tengah Kec. Selat Kode Pos 73514" -> "Selat Tengah" */
function toTitleCase(s){
  return String(s||'').toLowerCase().split(' ').map(w=> w ? w.charAt(0).toUpperCase()+w.slice(1) : w).join(' ');
}
function extractDesaFromAlamat(alamat){
  if(!alamat) return '';
  const m = String(alamat).match(/\b(?:Kel(?:urahan)?\.?|Desa)\s+([^,]+?)(?=\s+(?:Kec(?:amatan)?\.?|Kab(?:upaten)?\.?|Kode\s*Pos|Prov(?:insi)?\.?|$)|,|$)/i);
  return m ? m[1].trim() : '';
}


/* =====================================================================
   PEMBARUAN V6 — Tanda tangan rekap Dinkes: Kepala Dinas (kiri) & PJ Mutu Dinkes (kanan)
   ===================================================================== */
async function saveKepalaDinas(){
  const val = id => (document.getElementById(id) || {value:''}).value.trim();
  const data = {nama:val('kd-nama'), nip:val('kd-nip'), pjMutuNama:val('kd-pj-nama'), pjMutuNip:val('kd-pj-nip'), alamat:val('kd-alamat')};
  try{
    await db.collection('config').doc('kepala_dinas').set(data, {merge:true});
    STATE.kepalaDinas = Object.assign({}, STATE.kepalaDinas||{}, data);
    toast('Data Kepala Dinas & PJ Mutu Dinkes tersimpan.');
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}


/* Label instansi di sidebar: Dinkes -> "Dinkes Kab. Kapuas"; akun fasilitas -> nama fasilitasnya */
function sidebarOrgLabel(){
  const p = STATE.profile;
  if(p && p.role!=='dinkes' && p.facilityId){
    const f = STATE.facilities.find(x=>x.id===p.facilityId);
    if(f){ const t = facilityTypeLabel(f.type); return (t ? t+' ' : '')+f.name; }
  }
  return 'Dinkes Kab. Kapuas';
}
