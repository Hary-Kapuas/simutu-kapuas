<style>
  :root{
    --ink:#12312B;        --ink-soft:#3F5C56;
    --paper:#F6F5F0;      --paper-raised:#FFFFFF;
    --line:#DCD8CB;       --line-soft:#EAE7DC;
    --teal:#0E6E62;       --teal-deep:#0A4F46;     --teal-mist:#E4F1EE;
    --amber:#B9791A;      --amber-mist:#FAF0DC;
    --rust:#B24435;       --rust-mist:#F8E9E6;
    --focus:#1C7D6E;
    --radius:10px;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EAF2EF;       --ink-soft:#AFC4BE;
      --paper:#0E1613;     --paper-raised:#16211D;
      --line:#2A3733;      --line-soft:#1E2925;
      --teal:#3FA294;      --teal-deep:#7FC5B8;    --teal-mist:#173029;
      --amber:#E0AE5C;     --amber-mist:#2B2312;
      --rust:#E08472;      --rust-mist:#2E1A16;
      --focus:#3FA294;
    }
  }
  :root[data-theme="dark"]{
    --ink:#EAF2EF; --ink-soft:#AFC4BE; --paper:#0E1613; --paper-raised:#16211D;
    --line:#2A3733; --line-soft:#1E2925; --teal:#3FA294; --teal-deep:#7FC5B8;
    --teal-mist:#173029; --amber:#E0AE5C; --amber-mist:#2B2312; --rust:#E08472; --rust-mist:#2E1A16; --focus:#3FA294;
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4',Georgia,serif;}
  ::selection{background:var(--teal-mist);}
  a{color:var(--teal-deep);}
  button{font-family:inherit;}
  *:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; width:100%;}
  th,td{padding:9px 12px; text-align:left; white-space:nowrap; font-size:13.5px;}
  thead th{position:sticky; top:0; background:var(--paper-raised); border-bottom:1.5px solid var(--line); font-weight:700; color:var(--ink-soft); font-size:11.5px; letter-spacing:.02em; z-index:1;}
  tbody tr{border-bottom:1px solid var(--line-soft);}
  tbody tr:hover{background:var(--teal-mist);}
  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);}
  .btn{display:inline-flex; align-items:center; gap:6px; border-radius:8px; padding:9px 16px; font-weight:600; font-size:14px; cursor:pointer; border:1px solid transparent; transition:filter .12s;}
  .btn:hover{filter:brightness(0.95);}
  .btn:active{filter:brightness(0.88);}
  .btn-primary{background:var(--teal); color:white;}
  .btn-secondary{background:var(--paper-raised); color:var(--ink); border-color:var(--line);}
  .btn-ghost{background:transparent; color:var(--ink-soft);}
  .btn-danger{background:var(--rust-mist); color:var(--rust);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  input,select,textarea{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:7px;
    padding:8px 10px; font-size:14px; color:var(--ink); font-family:inherit; width:100%;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--focus);}
  label{font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:12px; font-weight:700;}
  .pill-ok{background:var(--teal-mist); color:var(--teal-deep);}
  .pill-warn{background:var(--amber-mist); color:var(--amber);}
  .pill-bad{background:var(--rust-mist); color:var(--rust);}
  .navlink{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--ink-soft); font-weight:600; font-size:13.5px; cursor:pointer;}
  .navlink:hover{background:var(--line-soft);}
  .navlink.active{background:var(--teal); color:#fff;}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .spinner{width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--teal); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media print{
    .no-print{display:none !important;}
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ display:block !important; position:absolute; top:0; left:0; width:100%; padding:24px; }
    body{background:white;}
  }
  #print-area{ display:none; }
  @media (max-width: 760px){
    #sidebar{ width:100% !important; height:auto !important; position:static !important; border-right:none !important; border-bottom:1px solid var(--line); padding:10px 12px !important; }
    #sidebar-nav{ display:flex; overflow-x:auto; gap:4px; padding-bottom:2px; }
    #sidebar-nav .navlink{ white-space:nowrap; flex-shrink:0; }
    #sidebar-footer{ display:flex !important; align-items:center; justify-content:space-between; margin-top:8px !important; padding-top:8px !important; }
    #sidebar-footer > div:first-child{ padding:0 !important; }
    main header{ padding:14px 16px !important; }
    #main-content{ padding:16px !important; }
    th,td{ font-size:12.5px; padding:7px 9px; }
  }
</style>

let downloadsCap = null;
(async ()=>{
  try{
    if(window.claude && window.claude.use){
      downloadsCap = await window.claude.use('downloads');
    }
  }catch(e){ downloadsCap = null; }
})();
async function downloadFile(filename, content, mime){
  if(downloadsCap){
    try{
      await downloadsCap.save({filename, data: content});
      return;
    }catch(e){ /* fall through */ }
  }
  // Fallback for non-published/local preview contexts
  const blob = new Blob([content], {type: mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function downloadXlsx(filename, aoa, sheetName){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  XLSX.utils.book_append_sheet(wb, ws, sheetName||'Data');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const reader = new FileReader();
  reader.onload = async function(){
    const base64 = reader.result.split(',')[1];
    if(downloadsCap){
      try{ await downloadsCap.save({filename, data: base64, encoding:'base64'}); return; }catch(e){}
    }
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  };
  reader.readAsDataURL(blob);
}

/* ============================= BUKTI DUKUNG (upload ke Google Drive) & VERIFIKASI ============================= */
async function uploadBuktiDukung(fileInputEl, statusElId){
  const file = fileInputEl.files[0];
  if(!file) return null;
  if(file.size > 5*1024*1024){ toast('Ukuran file maksimal 5MB.', 'error'); return null; }
  const statusEl = statusElId ? document.getElementById(statusElId) : null;
  if(statusEl) statusEl.textContent = 'Mengunggah...';
  try{
    const base64 = await new Promise((res,rej)=>{
      const reader = new FileReader();
      reader.onload = ()=>res(reader.result.split(',')[1]);
      reader.onerror = rej;
      reader.readAsDataURL(file);
    });
    const resp = await fetch(UPLOAD_SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({fileBase64:base64, fileName:file.name, mimeType:file.type||'application/octet-stream'})
    });
    const data = await resp.json();
    if(!data.success) throw new Error(data.error||'Upload gagal');
    if(statusEl) statusEl.textContent = 'Terunggah: '+file.name;
    return {url:data.url, name:file.name};
  }catch(e){
    if(statusEl) statusEl.textContent = '';
    toast('Gagal mengunggah bukti dukung: '+e.message, 'error');
    return null;
  }
}

async function saveVerifikasi(collection, docId){
  const status = document.getElementById('vf-status').value;
  const catatan = document.getElementById('vf-catatan').value.trim();
  try{
    await db.collection(collection).doc(docId).update({
      statusVerifikasi: status, catatanVerifikasi: catatan,
      verifiedBy: STATE.profile.name||STATE.user.email, verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast('Status verifikasi tersimpan.');
    const host = document.getElementById('verifikasi-modal-host'); if(host) host.remove();
    if(window.__verifikasiReload) window.__verifikasiReload();
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}

/* ============================= AUTH & BOOTSTRAP ============================= */
auth.onAuthStateChanged(async (u)=>{
  STATE.user = u;
  if(!u){ STATE.profile=null; STATE.view='login'; render(); return; }
  try{
    const snap = await db.collection('users').doc(u.uid).get();
    if(!snap.exists){
      STATE.profile = null; STATE.view='no-profile'; render(); return;
    }
    STATE.profile = snap.data();
    STATE.view = STATE.profile.role==='dinkes' ? 'dinkes' : 'facility';
    if(STATE.profile.role!=='dinkes') STATE.selectedFacilityId = STATE.profile.facilityId;
    await loadFacilities();
    await loadTargets();
    render();
  }catch(e){
    console.error(e); STATE.view='login'; render();
  }
});

async function loadFacilities(){
  const snap = await db.collection('facilities').orderBy('name').get();
  STATE.facilities = snap.docs.map(d=>({id:d.id, ...d.data()}));
  STATE.facilitiesLoaded = true;
}
async function loadTargets(){
  try{
    const snap = await db.collection('config').doc('inm_targets').get();
    STATE.targets = snap.exists ? snap.data() : {};
  }catch(e){ STATE.targets = {}; }
  try{
    const snap2 = await db.collection('config').doc('kepala_dinas').get();
    STATE.kepalaDinas = snap2.exists ? snap2.data() : {};
  }catch(e){ STATE.kepalaDinas = {}; }
}
function getTarget(indId){
  const def = INM.find(i=>i.id===indId).target;
  if(STATE.targets && STATE.targets[indId]!==undefined) return STATE.targets[indId];
  return def;
}

  if(!ringkasanData && !ringkasanLoading){ loadRingkasan(); }

  const reported = ringkasanData ? ringkasanData.filter(r=>r.reportedCount>0).length : 0;
  const effN = inmEffectiveIndicators(STATE.period).length;

  let avgRows = '';

    avgRows = INM.map(ind=>{
      const vals = ringkasanData.map(r=>r.values[ind.id]).filter(v=>v!==null && v!==undefined);

      const t = getTarget(ind.id);
      return `<tr>
        <td style="font-weight:600;">${esc(ind.name)}</td>

    <div class="card" style="padding:18px; margin-bottom:22px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">

async function loadCrossModuleSummary(){
  const [ikpSnap, ppiPajananSnap, ppiChecklistSnap, ppiAuditSnap, auditTemuanSnap, riskSnap, mfkSnap, b3Snap] = await Promise.all([
    db.collection('ikp_reports').get(), db.collection('ppi_pajanan').get(), db.collection('ppi_checklist').get(),
    db.collection('ppi_audit').get(), db.collection('audit_temuan').get(), db.collection('risk_register').get(),
    db.collection('mfk_register').get(), db.collection('k3_b3').get(),
  ]);
  const ikp = ikpSnap.docs.map(d=>d.data());
  const checklistDocs = ppiChecklistSnap.docs.map(d=>d.data());
  const temuanDocs = auditTemuanSnap.docs.map(d=>d.data());
  const riskDocs = riskSnap.docs.map(d=>d.data());
  const mfkDocs = mfkSnap.docs.map(d=>d.data());
  crossModuleSummary = {
    ikpTotal: ikp.length, ikpTinggi: ikp.filter(i=>i.grading==='High'||i.grading==='Extreme').length,
    ppiPajananTotal: ppiPajananSnap.size,
    ppiChecklistAvg: checklistDocs.length? Math.round((checklistDocs.reduce((a,b)=>a+(b.skor||0),0)/checklistDocs.length)*100)/100 : null,

async function loadRingkasan(){

async function drawRingkasanChart(){
  const canvas = document.getElementById('chart-ringkasan');
  if(!canvas || typeof Chart==='undefined') return;
  const periods = last12Periods();
  const facs = STATE.facilities.filter(f=>f.active!==false);
  const seriesByInd = {}; INM.forEach(i=>seriesByInd[i.id]=[]);
  for(const p of periods){
    const snaps = await Promise.all(facs.map(f=>db.collection('inm_reports').doc(f.id+'_'+p).get()));
    INM.forEach(ind=>{
      const vals=[];
      snaps.forEach(s=>{ if(s.exists){ const v=s.data().indicators && s.data().indicators[ind.id]; const pv=v?pct(v.num,v.den):null; if(pv!==null) vals.push(pv);} });
      seriesByInd[ind.id].push(vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null);
    });
  }
  const colors = ['#0E6E62','#B9791A','#B24435','#3F5C56','#1C7D6E','#7A4FA0'];
  new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels: periods.map(periodLabel),
      datasets: INM.map((ind,i)=>({label:ind.short, data:seriesByInd[ind.id], borderColor:colors[i%colors.length], backgroundColor:'transparent', tension:.3, spanGaps:true})) },
    options:{ responsive:true, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}, scales:{y:{min:0,max:100, ticks:{callback:v=>v+'%'}}} }
  });
}

async function savePmpReport(facilityId, period){
  const el = document.getElementById(STATE.view==='dinkes'?'pmp-dinkes-body':'pmp-fac-body');
  const nums = el.querySelectorAll('[data-pmp-num]');
  const values = {};
  nums.forEach(inp=>{
    const id = inp.getAttribute('data-pmp-num');
    const den = el.querySelector(`[data-pmp-den="${id}"]`).value;
    values[id] = {num: Number(inp.value)||0, den: Number(den)||0};
  });
  const fileInput = document.getElementById('pmp-bukti-file');
  let buktiData = null;
  if(fileInput && fileInput.files[0]){
    buktiData = await uploadBuktiDukung(fileInput, 'pmp-bukti-status');
    if(!buktiData) return;
  }
  try{
    const payload = { facilityId, period, values, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: STATE.user.uid };
    if(buktiData){ payload.buktiDukungUrl = buktiData.url; payload.buktiDukungName = buktiData.name; }
    await db.collection('pmp_reports').doc(facilityId+'_'+period).set(payload, {merge:true});
    toast('Data PMP tersimpan.');
    loadPmpForFacility(facilityId, period, el.id, true);
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}

async function loadIkpKepatuhan(period){
  const el = document.getElementById('ikp-kepatuhan-body'); if(!el) return;
  try{
    const facs = STATE.facilities.filter(f=>f.active!==false);
    const w = anWindowSingle(period);
    const [incSnap, nihilSnap] = await Promise.all([db.collection('ikp_reports').get(), db.collection('ikp_nihil').where('period','==',period).get()]);
    const incByFac = {}; incSnap.docs.forEach(d=>{ const it = d.data(); if(it.tanggal>=w.start && it.tanggal<=w.end){ incByFac[it.facilityId] = (incByFac[it.facilityId]||0)+1; } });
    const nihilFacs = new Set(nihilSnap.docs.map(d=>d.data().facilityId));
    const lapor = [], nihil = [], belum = [];
    facs.forEach(f=>{ if(incByFac[f.id]) lapor.push(f.name+' ('+incByFac[f.id]+')'); else if(nihilFacs.has(f.id)) nihil.push(f.name); else belum.push(f.name); });
    if(document.getElementById('ikp-kepatuhan-body') !== el) return;
    el.innerHTML = `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;">
      <div><span class="pill pill-ok">Ada insiden: ${lapor.length}</span><div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; white-space:normal;">${esc(lapor.join(', ')||'—')}</div></div>
      <div><span class="pill pill-ok">Nihil: ${nihil.length}</span><div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; white-space:normal;">${esc(nihil.join(', ')||'—')}</div></div>
      <div><span class="pill pill-warn">Belum lapor: ${belum.length}</span><div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px; white-space:normal;">${esc(belum.join(', ')||'—')}</div></div>
    </div>`;
  }catch(e){ if(el) el.innerHTML = `<span style="color:var(--rust); font-size:12.5px;">Gagal memuat: ${esc(e.message)}</span>`; }
}

async function saveFacility(id){

async function createFacilityAccount(){
  const facilityId = document.getElementById('new-acc-facility').value;
  const email = document.getElementById('new-acc-email').value.trim();
  const pass = document.getElementById('new-acc-pass').value;
  const name = document.getElementById('new-acc-name').value.trim();
  const nip = document.getElementById('new-acc-nip').value.trim();
  const kepalaNama = document.getElementById('new-acc-kepalanama').value.trim();
  const kepalaNip = document.getElementById('new-acc-kepalanip').value.trim();
  if(!facilityId || !email || !pass || pass.length<6) return toast('Lengkapi form. Kata sandi minimal 6 karakter.', 'error');
  try{
    // secondary app instance so the admin session is not replaced
    const secondary = firebase.apps.find(a=>a.name==='secondary') || firebase.initializeApp(firebaseConfig, 'secondary');
    const secAuth = secondary.auth();
    const cred = await secAuth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    await secAuth.signOut();
    await db.collection('users').doc(uid).set({ email, name: name||email, nip, role:'facility', facilityId, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    if(kepalaNama || kepalaNip){
      await db.collection('facilities').doc(facilityId).set({kepalaNama, kepalaNip}, {merge:true});
      await loadFacilities();
    }
    toast('Akun berhasil dibuat untuk '+email);
    document.getElementById('new-acc-email').value='';
    document.getElementById('new-acc-pass').value='';
    document.getElementById('new-acc-name').value='';
    document.getElementById('new-acc-nip').value='';
    accountsCache=null; loadAccounts();
  }catch(e){
    let msg = e.message;
    if(e.code==='auth/email-already-in-use') msg='Email sudah terdaftar.';
    toast('Gagal membuat akun: '+msg, 'error');
  }
}

async function loadIkpNihilStatus(facilityId, period){
  const el = document.getElementById('ikp-nihil-status'); if(!el) return;
  try{
    const [nihilSnap, incSnap] = await Promise.all([
      db.collection('ikp_nihil').doc(facilityId+'_'+period).get(),
      db.collection('ikp_reports').where('facilityId','==',facilityId).get()
    ]);
    const w = anWindowSingle(period);
    const hasIncident = incSnap.docs.some(d=>{ const t = d.data().tanggal; return t && t>=w.start && t<=w.end; });
    if(nihilSnap.exists){
      const t = tsToDate(nihilSnap.data().reportedAt);
      el.innerHTML = `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span class="pill pill-ok">Nihil dilaporkan${t?' — '+fmtDateID(t):''}</span>
        <button class="btn btn-ghost no-print" style="padding:4px 8px; font-size:12px;" onclick="cancelIkpNihil('${facilityId}','${period}')">Batalkan</button>
      </div>`;
    } else if(hasIncident){
      el.innerHTML = `<span class="pill pill-warn">Sudah ada insiden dilaporkan bulan ini — tidak perlu lapor Nihil</span>`;
    } else {
      el.innerHTML = `<button class="btn btn-secondary" onclick="declareIkpNihil('${facilityId}','${period}')">Tidak Ada Insiden Bulan Ini (Lapor Nihil)</button>`;
    }
  }catch(e){ el.innerHTML = `<span style="color:var(--rust); font-size:12.5px;">Gagal memuat status: ${esc(e.message)}</span>`; }
}
async function declareIkpNihil(facilityId, period){
  try{
    await db.collection('ikp_nihil').doc(facilityId+'_'+period).set({
      facilityId, period, reportedBy: (STATE.profile&&STATE.profile.name)||STATE.user.email, reportedAt: firebase.firestore.FieldValue.serverTimestamp()

}
async function cancelIkpNihil(facilityId, period){
  if(!confirm('Batalkan laporan Nihil bulan ini?')) return;
  try{
    await db.collection('ikp_nihil').doc(facilityId+'_'+period).delete();
    toast('Laporan Nihil dibatalkan.');
    loadIkpNihilStatus(facilityId, period);
  }catch(e){ toast('Gagal membatalkan: '+e.message, 'error'); }
}
function anWindowSingle(period){
  const parts = String(period).split('-').map(Number), y = parts[0], m = parts[1];
  const dim = new Date(y, m, 0).getDate();
  return {start: period+'-01', end: period+'-'+String(dim).padStart(2,'0')};
}
function updateIkpGradingPreview(){
  const probEl = document.getElementById('ikp-prob'); const dampakEl = document.getElementById('ikp-dampak');
  const box = document.getElementById('ikp-grading-preview');
  if(!probEl || !dampakEl || !box) return;
  const g = computeGrading(Number(probEl.value), Number(dampakEl.value));
  box.innerHTML = g ? `Grading: <span class="pill ${GRADING_COLOR[g]}">${g}</span> — ${esc(GRADING_ACTION[g])}` : 'Pilih probabilitas dan dampak untuk melihat grading.';
  const tlField = document.getElementById('ikp-tindaklanjut');
  if(tlField && !tlField.dataset.touched){ tlField.value = g ? GRADING_ACTION[g] : ''; }
}
async function submitIkpReport(facilityId){
  const tanggal = document.getElementById('ikp-tanggal').value;
  const unit = document.getElementById('ikp-unit').value.trim();
  const deskripsi = document.getElementById('ikp-deskripsi').value.trim();
  const jenis = document.getElementById('ikp-jenis').value;
  const prob = Number(document.getElementById('ikp-prob').value);
  const dampak = Number(document.getElementById('ikp-dampak').value);
  const tindakLanjut = document.getElementById('ikp-tindaklanjut').value.trim();
  if(!tanggal || !unit || !deskripsi) return toast('Tanggal, unit, dan uraian kejadian wajib diisi.', 'error');
  const bukti = await maybeUploadBukti('ikp');
  if(!bukti.ok) return;
  const grading = computeGrading(prob, dampak);
  try{
    const payload = {
      facilityId, tanggal, unit, deskripsi, jenis, probabilitas:prob, dampak, grading, tindakLanjut,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: STATE.user.uid
    };
    applyBukti(payload, bukti);
    await db.collection('ikp_reports').add(payload);
    toast('Laporan insiden tersimpan.');
    ['ikp-unit','ikp-deskripsi','ikp-tindaklanjut'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ikp-tindaklanjut').dataset.touched='';
    loadFacIkpList(facilityId);
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}

  const sumber = Array.from(document.querySelectorAll('.pj-sumber:checked')).map(c=>c.value);
  const g = id=>document.getElementById(id).value.trim();
  if(!g('pj-tgllapor') || !g('pj-nama') || !g('pj-uraian')) return toast('Tanggal laporan, nama, dan uraian kejadian wajib diisi.', 'error');
  const bukti = await maybeUploadBukti('pj');
  if(!bukti.ok) return;
  try{
    const payload = {
      facilityId, tanggalLaporan:g('pj-tgllapor'), tanggalPajanan:g('pj-tglpajanan'), tempatKejadian:g('pj-tempat'), unitKerja:g('pj-unit'),
      nama:g('pj-nama'), routePajanan:routes, sumberPajanan:sumber, bagianTubuh:g('pj-bagiantubuh'),
      uraianKejadian:g('pj-uraian'), imunisasiHepB:g('pj-hepb'), alatPelindung:g('pj-apd'), jenisAlatPelindung:g('pj-jenisapd'),
      pertolonganPertama:g('pj-p3k'), tempatPertolongan:g('pj-tempatp3k'), statusPemeriksaan:g('pj-status'),
      namaSumber:g('pj-namasumber'), noRM:g('pj-norm'), ruangRawat:g('pj-ruangrawat'), pemantauanPajanan:g('pj-pemantauan'),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: STATE.user.uid
    };
    applyBukti(payload, bukti);
    await db.collection('ppi_pajanan').add(payload);
    toast('Laporan pajanan tersimpan.');
    renderFacilityShell();
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}

/* -- Daftar Tilik PPI (checklist) -- */
function ppiChecklistFormHtml(){
  let idx=0;
  const rows = PPI_CHECKLIST_CATEGORIES.map(cat=>{
    const catRows = cat.items.map(item=>{
      idx++;
      return `<tr>
        <td style="white-space:normal;">${esc(item)}</td>
        <td>
          <select class="ppi-chk-item" data-idx="${idx}" onchange="updatePpiChecklistPreview()">
            ${PPI_RATING_SCALE.map(r=>`<option value="${r.v}">${r.label}</option>`).join('')}
          </select>
        </td>
      </tr>`;
    }).join('');
    return `<tr><td colspan="2" style="background:var(--teal-mist); font-weight:700; color:var(--teal-deep);">${esc(cat.cat)}</td></tr>${catRows}`;
  }).join('');
  return `<div class="card" style="padding:18px; max-width:640px;">
    <h3 class="serif" style="margin:0 0 14px; font-size:16px;">Daftar Tilik Pencegahan &amp; Pengendalian Infeksi</h3>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;">
      <div><label>Ruang</label><input type="text" id="chk-ruang" placeholder="Contoh: Poli Umum"></div>
      <div><label>Bulan</label><input type="month" id="chk-bulan" value="${currentPeriod()}"></div>
    </div>
    <div class="scrollx"><table><thead><tr><th>Indikator / Tindakan</th><th>Penilaian</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div id="ppi-checklist-preview" style="margin:14px 0; padding:10px 12px; background:var(--paper); border-radius:8px; font-size:13.5px; font-weight:600;"></div>
    ${newRecordBuktiFieldHtml('chk')}
    <button class="btn btn-primary" onclick="submitPpiChecklist('${STATE.profile.facilityId||(STATE.selectedFacilityId)}')">Simpan Daftar Tilik</button>
  </div>`;
}
function updatePpiChecklistPreview(){
  const sels = document.querySelectorAll('.ppi-chk-item');
  const box = document.getElementById('ppi-checklist-preview');
  if(!sels.length || !box) return;
  let total=0;
  sels.forEach(s=>{ total += Number(s.value); });
  const pct = Math.round((total/(sels.length*5))*10000)/100;
  const cat = ppiCategoryFromPct(pct);
  box.innerHTML = `Skor kepatuhan: ${pct}% — <span class="pill ${cat==='Sangat Baik'?'pill-ok':cat==='Baik'?'pill-ok':cat==='Cukup'?'pill-warn':'pill-bad'}">${cat}</span>`;
}
async function submitPpiChecklist(facilityId){
  const ruang = document.getElementById('chk-ruang').value.trim();
  const bulan = document.getElementById('chk-bulan').value;
  if(!ruang || !bulan) return toast('Ruang dan bulan wajib diisi.', 'error');
  const sels = document.querySelectorAll('.ppi-chk-item');
  let total=0; const items={};
  let flatIdx=0;
  PPI_CHECKLIST_CATEGORIES.forEach(cat=>{ cat.items.forEach(item=>{ flatIdx++; const sel=document.querySelector(`.ppi-chk-item[data-idx="${flatIdx}"]`); const val=Number(sel.value); items[cat.cat+' — '+item]=val; total+=val; }); });
  const pct = Math.round((total/(sels.length*5))*10000)/100;
  const kategori = ppiCategoryFromPct(pct);
  const bukti = await maybeUploadBukti('chk');
  if(!bukti.ok) return;
  try{
    const payload = { facilityId, ruang, period:bulan, items, skor:pct, kategori, createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: STATE.user.uid };
    applyBukti(payload, bukti);
    await db.collection('ppi_checklist').add(payload);
    toast('Daftar tilik tersimpan.');
    loadPpiChecklistList(facilityId);
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}
async function loadPpiChecklistList(facilityId){
  const el = document.getElementById('ppi-checklist-list'); if(!el) return;
  const snap = await db.collection('ppi_checklist').where('facilityId','==',facilityId).orderBy('period','desc').limit(50).get()
    .catch(()=>db.collection('ppi_checklist').where('facilityId','==',facilityId).get());
  const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(items.length===0){ el.innerHTML=`<div class="card" style="padding:18px; text-align:center; color:var(--ink-soft);">Belum ada daftar tilik.</div>`; return; }
  el.innerHTML = `<div class="card scrollx" style="padding:4px;"><table>
    <thead><tr><th>Bulan</th><th>Ruang</th><th>Skor</th><th>Kategori</th>${buktiTh()}<th></th></tr></thead>
    <tbody>${items.map(it=>`<tr>
      <td>${periodLabel(it.period)}</td><td>${esc(it.ruang)}</td><td>${it.skor}%</td>
      <td><span class="pill ${it.kategori==='Sangat Baik'||it.kategori==='Baik'?'pill-ok':it.kategori==='Cukup'?'pill-warn':'pill-bad'}">${esc(it.kategori)}</span></td>

async function submitPpiAudit(facilityId){
  const ruang = document.getElementById('ad-ruang').value.trim();
  const auditor = document.getElementById('ad-auditor').value.trim();
  const tanggal = document.getElementById('ad-tanggal').value;
  if(!ruang || !auditor || !tanggal) return toast('Ruang, auditor, dan tanggal wajib diisi.', 'error');
  const answers = PPI_AUDIT_QUESTIONS.map((q,i)=>{
    const sel = document.querySelector(`input[name="ad-q${i}"]:checked`);
    const alasan = document.querySelector(`.ad-alasan[data-idx="${i}"]`).value.trim();
    return {no:i+1, pertanyaan:q, jawaban: sel?sel.value:'', alasan};
  });
  const bukti = await maybeUploadBukti('ad');
  if(!bukti.ok) return;
  try{
    const payload = { facilityId, ruang, auditor, tanggal, answers, createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: STATE.user.uid };
    applyBukti(payload, bukti);
    await db.collection('ppi_audit').add(payload);
    toast('Audit tersimpan.');
    renderFacilityShell();
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}
async function loadPpiAuditList(facilityId){
  const el = document.getElementById('ppi-audit-list'); if(!el) return;
  const snap = await db.collection('ppi_audit').where('facilityId','==',facilityId).orderBy('tanggal','desc').limit(50).get()
    .catch(()=>db.collection('ppi_audit').where('facilityId','==',facilityId).get());
  const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(items.length===0){ el.innerHTML=`<div class="card" style="padding:18px; text-align:center; color:var(--ink-soft);">Belum ada audit tercatat.</div>`; return; }
  el.innerHTML = `<div class="card scrollx" style="padding:4px;"><table>
    <thead><tr><th>Tanggal</th><th>Ruang</th><th>Auditor</th><th>Ya</th><th>Tidak</th><th>Kadang</th>${buktiTh()}<th></th></tr></thead>
    <tbody>${items.map(it=>{
      const y=it.answers.filter(a=>a.jawaban==='Y').length, t=it.answers.filter(a=>a.jawaban==='T').length, k=it.answers.filter(a=>a.jawaban==='K').length;
      return `<tr><td>${esc(it.tanggal)}</td><td>${esc(it.ruang)}</td><td>${esc(it.auditor)}</td><td>${y}</td><td>${t}</td><td>${k}</td>

async function deletePpiDoc(collection, id, kind){
  if(!confirm('Hapus data ini?')) return;
  const facilityId = STATE.profile.facilityId || STATE.selectedFacilityId;
  try{
    await db.collection(collection).doc(id).delete();
    toast('Data dihapus.');
    if(kind==='ppi_pajanan') loadPpiPajananList(facilityId);
    if(kind==='ppi_checklist') loadPpiChecklistList(facilityId);
    if(kind==='ppi_audit') loadPpiAuditList(facilityId);
  }catch(e){ toast('Gagal menghapus: '+e.message, 'error'); }
}

function updateIcraScorePreview(){
  const p=document.getElementById('icra-p'), d=document.getElementById('icra-d'), s=document.getElementById('icra-s');

  box.textContent = 'Skor risiko: '+icraScore(p.value,d.value,s.value)+' (dari maksimal 125) — semakin tinggi, semakin prioritas.';

async function submitIcra(facilityId){

  const bukti = await maybeUploadBukti('icra');
  if(!bukti.ok) return;
  try{
    const payload = { facilityId, uraian, probabilitas:p, dampak:d, sistem:s, score:icraScore(p,d,s),
      tujuanUmum:g('icra-tujuanumum'), tujuanKhusus:g('icra-tujuankhusus'), strategi:g('icra-strategi'), evaluasi:g('icra-evaluasi'),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: STATE.user.uid };
    applyBukti(payload, bukti);
    await db.collection('ppi_icra').add(payload);
    toast('ICRA tersimpan.');
    renderFacilityShell();
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}
async function loadIcraList(facilityId, editable, targetId){
  const el = document.getElementById(targetId || (editable?'ppi-icra-list':'ppi-icra-dinkes-list'));
  if(!el) return;
  let items = [];
  try{
    const snap = await db.collection('ppi_icra').where('facilityId','==',facilityId).get();
    items = snap.docs.map(x=>({id:x.id, ...x.data()}));
    items.sort((a,b)=> (b.score||0)-(a.score||0));
  }catch(e){ toast('Gagal memuat ICRA: '+e.message, 'error'); }
  if(items.length===0){ el.innerHTML = `<div class="card" style="padding:18px; text-align:center; color:var(--ink-soft);">Belum ada ICRA tercatat.</div>`; return; }
  el.innerHTML = `<div class="card scrollx" style="padding:4px;"><table>
    <thead><tr><th>Rangking</th><th style="min-width:160px;">Uraian</th><th>P</th><th>D</th><th>S</th><th>Skor</th><th>Strategi / RTL</th>${buktiTh()}<th></th></tr></thead>
    <tbody>${items.map((it,i)=>`<tr>
      <td style="font-weight:700;">${i+1}</td>
      <td style="white-space:normal; min-width:160px;">${esc(it.uraian)}</td>
      <td>${it.probabilitas}</td><td>${it.dampak}</td><td>${it.sistem}</td>
      <td style="font-weight:700;">${it.score}</td>
      <td style="white-space:normal; min-width:200px;">${esc(it.strategi||'—')}${it.evaluasi?`<div style="font-size:11.5px; color:var(--ink-soft); margin-top:3px;">Evaluasi: ${esc(it.evaluasi)}</div>`:''}</td>
      ${buktiTd(it,'ppi_icra', editable?'null':`loadIcraListDinkes`, !editable)}
      <td class="no-print" style="white-space:nowrap;">${editable?`<button class="btn btn-ghost" style="padding:3px 7px; font-size:11.5px; display:block; margin-bottom:3px;" onclick="editIcraModal('${facilityId}','${it.id}')">Ubah</button><button class="btn btn-ghost" style="padding:3px 7px; font-size:11.5px; color:var(--rust);" onclick="deleteRecordWithLog('ppi_icra','${it.id}', ()=>loadIcraList('${facilityId}',true))">Hapus</button>`:''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

        <div><label>Dampak</label><select id="ie-d">${ICRA_DAMPAK.map(x=>`<option value="${x.v}" ${it.dampak===x.v?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>
        <div><label>Sistem</label><select id="ie-s">${ICRA_SISTEM.map(x=>`<option value="${x.v}" ${it.sistem===x.v?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>

      <label>Tujuan Khusus</label><input id="ie-tujuankhusus" value="${esc(it.tujuanKhusus||'')}" style="margin-bottom:10px;">

      <div style="display:flex; gap:8px; justify-content:flex-end;">

async function saveIcraEdit(facilityId, id){
  const g = i => document.getElementById(i).value.trim();
  const uraian = g('ie-uraian');
  if(!uraian){ toast('Uraian wajib diisi.', 'error'); return; }
  const p=Number(document.getElementById('ie-p').value), d=Number(document.getElementById('ie-d').value), s=Number(document.getElementById('ie-s').value);
  try{
    await db.collection('ppi_icra').doc(id).update({ uraian, probabilitas:p, dampak:d, sistem:s, score:icraScore(p,d,s),
      tujuanUmum:g('ie-tujuanumum'), tujuanKhusus:g('ie-tujuankhusus'), strategi:g('ie-strategi'), evaluasi:g('ie-evaluasi') });

    const host = document.getElementById('icra-edit-modal-host'); if(host) host.remove();
    loadIcraList(facilityId, true);
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }

async function loadIcraListDinkes(){
  const el = document.getElementById('ppi-dinkes-body');

  if(ppiDinkesFacility==='all'){
    el.innerHTML = `<div class="card" style="padding:20px; text-align:center; color:var(--ink-soft);">Pilih satu fasilitas untuk melihat rangking ICRA-nya (rangking dihitung per fasilitas).</div>`;

let ppiDinkesCache = {pajanan:null, checklist:null, audit:null};
async function loadPpiDinkesRecap(sub){
  const coll = sub==='pajanan'?'ppi_pajanan':sub==='checklist'?'ppi_checklist':'ppi_audit';
  const snap = await db.collection(coll).limit(500).get();
  const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
  ppiDinkesCache[sub]=items;
  const el = document.getElementById('ppi-dinkes-body');
  if(!el || STATE.dinkesTab!=='ppi' || STATE.dinkesPpiSub!==sub) return;
  const filtered = items.filter(it=> ppiDinkesFacility==='all' || it.facilityId===ppiDinkesFacility);
  const facName = id => (STATE.facilities.find(f=>f.id===id)||{}).name || '—';
  let table = '';
  if(sub==='pajanan'){
    table = `<table><thead><tr><th>Tgl Laporan</th><th>Fasilitas</th><th>Nama</th><th>Unit</th><th>Status</th>${buktiTh()}</tr></thead>
      <tbody>${filtered.map(it=>`<tr><td>${esc(it.tanggalLaporan)}</td><td style="font-weight:600;">${esc(facName(it.facilityId))}</td><td>${esc(it.nama)}</td><td>${esc(it.unitKerja||'—')}</td><td style="white-space:normal;">${esc(it.statusPemeriksaan||'—')}</td>${buktiTd(it,'ppi_pajanan',`()=>loadPpiDinkesRecap('pajanan')`,true)}</tr>`).join('') || `<tr><td colspan="7" style="padding:16px; color:var(--ink-soft);">Belum ada data.</td></tr>`}</tbody></table>`;
  } else if(sub==='checklist'){
    table = `<table><thead><tr><th>Bulan</th><th>Fasilitas</th><th>Ruang</th><th>Skor</th><th>Kategori</th>${buktiTh()}</tr></thead>
      <tbody>${filtered.map(it=>`<tr><td>${periodLabel(it.period)}</td><td style="font-weight:600;">${esc(facName(it.facilityId))}</td><td>${esc(it.ruang)}</td><td>${it.skor}%</td><td><span class="pill ${it.kategori==='Sangat Baik'||it.kategori==='Baik'?'pill-ok':it.kategori==='Cukup'?'pill-warn':'pill-bad'}">${esc(it.kategori)}</span></td>${buktiTd(it,'ppi_checklist',`()=>loadPpiDinkesRecap('checklist')`,true)}</tr>`).join('') || `<tr><td colspan="7" style="padding:16px; color:var(--ink-soft);">Belum ada data.</td></tr>`}</tbody></table>`;
  } else {
    table = `<table><thead><tr><th>Tanggal</th><th>Fasilitas</th><th>Ruang</th><th>Auditor</th><th>Ya</th><th>Tidak</th><th>Kadang</th>${buktiTh()}</tr></thead>
      <tbody>${filtered.map(it=>{ const y=it.answers.filter(a=>a.jawaban==='Y').length, t=it.answers.filter(a=>a.jawaban==='T').length, k=it.answers.filter(a=>a.jawaban==='K').length;
      return `<tr><td>${esc(it.tanggal)}</td><td style="font-weight:600;">${esc(facName(it.facilityId))}</td><td>${esc(it.ruang)}</td><td>${esc(it.auditor)}</td><td>${y}</td><td>${t}</td><td>${k}</td>${buktiTd(it,'ppi_audit',`()=>loadPpiDinkesRecap('audit')`,true)}</tr>`; }).join('') || `<tr><td colspan="9" style="padding:16px; color:var(--ink-soft);">Belum ada data.</td></tr>`}</tbody></table>`;
  }
  el.innerHTML = `<div class="card scrollx" style="padding:4px;">${table}</div>`;
}
function exportPpiXlsx(sub){
  const items = ppiDinkesCache[sub];
  if(!items) return toast('Data belum siap.', 'error');
  const facName = id => (STATE.facilities.find(f=>f.id===id)||{}).name || '—';
  let aoa=[];
  if(sub==='pajanan'){
    aoa=[['Tgl Laporan','Fasilitas','Nama','Unit','Route Pajanan','Sumber Pajanan','Status Pemeriksaan']];
    items.forEach(it=>aoa.push([it.tanggalLaporan, facName(it.facilityId), it.nama, it.unitKerja, (it.routePajanan||[]).join(', '), (it.sumberPajanan||[]).join(', '), it.statusPemeriksaan]));
  } else if(sub==='checklist'){
    aoa=[['Bulan','Fasilitas','Ruang','Skor (%)','Kategori']];
    items.forEach(it=>aoa.push([periodLabel(it.period), facName(it.facilityId), it.ruang, it.skor, it.kategori]));
  } else {
    aoa=[['Tanggal','Fasilitas','Ruang','Auditor','Ya','Tidak','Kadang-kadang']];
    items.forEach(it=>{ const y=it.answers.filter(a=>a.jawaban==='Y').length, t=it.answers.filter(a=>a.jawaban==='T').length, k=it.answers.filter(a=>a.jawaban==='K').length;
      aoa.push([it.tanggal, facName(it.facilityId), it.ruang, it.auditor, y, t, k]); });
  }
  downloadXlsx(`PPI_${sub}.xlsx`, aoa, sub);
}

function auditJadwalFormHtml(facilityId){
  const year = new Date().getFullYear();
  return `<div class="card" style="padding:18px; max-width:900px;">
    <div style="display:flex; gap:12px; align-items:end; margin-bottom:14px;">
      <div><label>Tahun</label><input type="number" id="jd-tahun" value="${year}" style="width:110px;"></div>
      <button class="btn btn-secondary" onclick="loadAuditJadwal('${facilityId}')">Muat Jadwal</button>
    </div>
    <div id="jadwal-grid"><div class="spinner"></div></div>
  </div>
  ${printExportToolbar('Jadwal Audit Internal', '', '#jadwal-grid', 'Jadwal_Audit.xlsx', facilityId, null)}`;
}
async function loadAuditJadwal(facilityId){
  const tahunEl = document.getElementById('jd-tahun');
  const tahun = tahunEl ? tahunEl.value : new Date().getFullYear();
  const doc = await db.collection('audit_jadwal').doc(facilityId+'_'+tahun).get();
  const data = doc.exists ? doc.data() : {jadwal:{}, timAudit:[]};
  const grid = document.getElementById('jadwal-grid');
  if(!grid) return;
  grid.innerHTML = `
    <div class="scrollx"><table>
      <thead><tr><th>Unit Kerja</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}</tr></thead>
      <tbody>${AUDIT_KLASTER.map(k=>{
        const arr = (data.jadwal && data.jadwal[k]) || Array(12).fill(false);
        return `<tr><td style="font-weight:600;">${esc(k)}</td>${arr.map((v,i)=>`<td style="text-align:center;"><input type="checkbox" class="jd-cell" data-klaster="${esc(k)}" data-bulan="${i}" ${v?'checked':''} style="width:auto;"></td>`).join('')}</tr>`;
      }).join('')}</tbody>
    </table></div>
    <label style="margin-top:14px;">Tim Audit Internal (satu nama per baris)</label>
    <textarea id="jd-tim" rows="4">${esc((data.timAudit||[]).join('\n'))}</textarea>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="saveAuditJadwal('${facilityId}')">Simpan Jadwal</button>
  `;
}
async function saveAuditJadwal(facilityId){
  const tahun = document.getElementById('jd-tahun').value;
  const jadwal = {};
  AUDIT_KLASTER.forEach(k=>{ jadwal[k]=Array(12).fill(false); });
  document.querySelectorAll('.jd-cell').forEach(cb=>{
    const k = cb.getAttribute('data-klaster'); const b = Number(cb.getAttribute('data-bulan'));
    jadwal[k][b] = cb.checked;
  });
  const timAudit = document.getElementById('jd-tim').value.split('\n').map(s=>s.trim()).filter(Boolean);
  try{
    await db.collection('audit_jadwal').doc(facilityId+'_'+tahun).set({facilityId, tahun:Number(tahun), jadwal, timAudit, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
    toast('Jadwal audit tersimpan.');
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}

  </div>`;

function updateForm1Preview(){
  const klien = Number(document.getElementById('f1-klien').value)||0;
  const tks = Number(document.getElementById('f1-tks').value)||0;
  const box = document.getElementById('f1-preview');
  if(klien<=0){ box.textContent='Isi jumlah klien & ketidaksesuaian untuk melihat persentase.'; return; }
  const pct = Math.round((tks/klien)*10000)/100;
  const kat = auditKategoriFromPct(pct);
  box.innerHTML = `Persentase ketidaksesuaian: ${pct}% — Kategori: <span class="pill ${kat==='Baik'?'pill-ok':kat==='Cukup'?'pill-warn':'pill-bad'}">${kat}</span>`;
}
async function submitAuditForm1(facilityId){
  const g=id=>document.getElementById(id).value;
  const indikator=g('f1-indikator').trim(); const klien=Number(g('f1-klien'))||0; const tks=Number(g('f1-tks'))||0;
  if(!indikator || !g('f1-tanggal') || klien<=0) return toast('Indikator, tanggal, dan jumlah klien wajib diisi.', 'error');
  const pct = Math.round((tks/klien)*10000)/100;
  const kategori = auditKategoriFromPct(pct);
  const bukti = await maybeUploadBukti('f1');
  if(!bukti.ok) return;
  try{
    const payload = {
      facilityId, klaster:g('f1-klaster'), tahun:Number(g('f1-tahun')), indikator, tanggal:g('f1-tanggal'),
      jumlahKlien:klien, jumlahKetidaksesuaian:tks, persentase:pct, kategori, keterangan:g('f1-ket').trim(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdBy: STATE.user.uid
    };
    applyBukti(payload, bukti);
    await db.collection('audit_form1').add(payload);
    toast('Data tersimpan.');
    renderFacilityShell();
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}
async function loadAuditForm1List(facilityId){
  const el = document.getElementById('audit-form1-list'); if(!el) return;
  const snap = await db.collection('audit_form1').where('facilityId','==',facilityId).orderBy('tanggal','desc').limit(100).get()
    .catch(()=>db.collection('audit_form1').where('facilityId','==',facilityId).get());
  const items = snap.docs.map(d=>({id:d.id, ...d.data()}));
  if(items.length===0){ el.innerHTML=`<div class="card" style="padding:18px; text-align:center; color:var(--ink-soft);">Belum ada data.</div>`; return; }
  el.innerHTML = `<div class="card scrollx" style="padding:4px;"><table>
    <thead><tr><th>Tanggal</th><th>Klaster</th><th>Indikator</th><th>Klien</th><th>Ketidaksesuaian</th><th>%</th><th>Kategori</th>${buktiTh()}<th></th></tr></thead>
    <tbody>${items.map(it=>`<tr>
      <td>${esc(it.tanggal)}</td><td>${esc(it.klaster)}</td><td style="white-space:normal; min-width:180px;">${esc(it.indikator)}</td>

function exportAuditXlsx(sub){
  const items = auditDinkesCache[sub];

    aoa=[['Tanggal','Fasilitas','Klaster','Indikator','Jumlah Klien','Jumlah Ketidaksesuaian','Persentase','Kategori','Keterangan']];

  } else {
    aoa=[['Tanggal','Fasilitas','Klaster','Temuan','Bukti Obyektif','Standar/Indikator','Batas Waktu','Status','Tindakan Koreksi','Tanggal Selesai','Rencana Tindak Lanjut']];

function exportRiskXlsx(sub){
  const items = riskDinkesCache[sub];
  if(!items) return toast('Data belum siap.', 'error');
  const facName = id => (STATE.facilities.find(f=>f.id===id)||{}).name || '—';
  let aoa=[];

    aoa=[['Fasilitas','Kode Risiko','Kategori','Sub Kategori','Kegiatan','Risiko','Dampak','Kemungkinan','Bobot','Skor','Tingkat','Selera Risiko','Perlu Penanganan']];
    items.forEach(it=>aoa.push([facName(it.facilityId), it.kodeRisiko, it.kategoriUtama, it.kategoriSub, it.kegiatan, it.risiko, it.dampak, it.kemungkinan, it.bobot, it.skor, it.tingkat, it.seleraRisiko, it.perluPenanganan]));
  } else if(sub==='profil'){
    aoa=[['Fasilitas','Kode Risiko','Risiko Prioritas','Penyebab','Skor Inherent','Tingkat Inherent','Opsi Penanganan','Uraian Penanganan','Waktu Pelaksanaan','Skor Residual Target','Tingkat Residual Target']];
    items.forEach(it=>aoa.push([facName(it.facilityId), it.kodeRisiko, it.risikoPrioritas, it.penyebabAkarMasalah, it.inherentSkor, it.inherentTingkat, it.opsiPenanganan, it.uraianPenanganan, it.waktuPelaksanaan, it.residualSkor, it.residualTingkat]));
  } else {
    aoa=[['Fasilitas','Kode Risiko','Realisasi Penanganan','Hambatan','Usulan Alternatif','Skor Residual','Tingkat Residual','Selera Risiko','Trend','Efektivitas']];
    items.forEach(it=>aoa.push([facName(it.facilityId), it.kodeRisiko, it.realisasiPenanganan, it.hambatan, it.usulanAlternatif, it.residualSkor, it.residualTingkat, it.seleraRisiko, it.trendRisiko, it.efektivitas]));
  }
  downloadXlsx(`Risiko_${sub}.xlsx`, aoa, sub);
}

async function submitMfkRegister(facilityId){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('mf-unit') || !g('mf-risiko')) return toast('Unit kerja dan uraian risiko wajib diisi.', 'error');
  const s=Number(g('mf-severity')), p=Number(g('mf-probability'));

  try{
    const payload = {

const MAX_UPLOAD_BYTES = 10*1024*1024;
const MIME_BY_EXT = {pdf:'application/pdf', xls:'application/vnd.ms-excel', xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', csv:'text/csv',
  doc:'application/msword', docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', ppt:'application/vnd.ms-powerpoint',

/* ---------- Perbaikan: nama sheet Excel maks 31 karakter & tanpa karakter terlarang ---------- */
function downloadXlsx(filename, aoa, sheetName){
  const safeSheet = String(sheetName||'Data').replace(/[\\\/\?\*\[\]:]/g,'-').substring(0,31) || 'Data';
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  XLSX.utils.book_append_sheet(wb, ws, safeSheet);
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbout], {type:'application/octet-stream'});
  const reader = new FileReader();
  reader.onload = async function(){
    const base64 = reader.result.split(',')[1];
    if(downloadsCap){
      try{ await downloadsCap.save({filename, data: base64, encoding:'base64'}); return; }catch(e){}
    }
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
  };
  reader.readAsDataURL(blob);
}
function exportVisibleTable(filename, containerSelector, sheetName){
  const tables = document.querySelectorAll(containerSelector+' table');
  if(!tables.length){ toast('Belum ada data untuk diekspor.', 'error'); return; }
  const aoa = [];
  tables.forEach((table,ti)=>{
    if(ti>0) aoa.push([]);
    table.querySelectorAll('tr').forEach(tr=>{
      const cells = Array.from(tr.querySelectorAll('th,td')).map(td=>td.textContent.replace(/\s+/g,' ').trim());
      if(cells.length && cells.some(c=>c!=='')) aoa.push(cells);
    });
  });
  downloadXlsx(filename, aoa, sheetName||'Data');
}

/* ---------- Batas waktu pelaporan ---------- */
function deadlineForPeriod(period){
  const cfg = STATE.deadline || {};
  const hb = Number(cfg.hariBulanan)||10, ht = Number(cfg.hariTahunan)||31, bt = Number(cfg.bulanTahunan)||1;
  if(/^\d{4}-\d{2}$/.test(String(period))){
    const parts = period.split('-').map(Number); const y=parts[0], m=parts[1];
    const ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
    const dim = new Date(ny, nm, 0).getDate();
    return new Date(ny, nm-1, Math.min(hb, dim), 23, 59, 59);
  }
  if(/^\d{4}$/.test(String(period))){
    const y = Number(period)+1; const dim = new Date(y, bt, 0).getDate();
    return new Date(y, bt-1, Math.min(ht, dim), 23, 59, 59);
  }
  return null;
}
function fmtDateID(d){ return d.getDate()+' '+MONTHS_FULL[d.getMonth()]+' '+d.getFullYear(); }
function tsToDate(ts){ return ts && typeof ts.toDate==='function' ? ts.toDate() : null; }
function timelinessInfo(period, submittedAt, docExists){
  const dl = deadlineForPeriod(period); const sub = tsToDate(submittedAt);
  if(!dl) return {code:'na', label:'—', cls:'pill-warn', dl:null, sub:sub};
  if(sub) return sub<=dl ? {code:'ontime', label:'Tepat waktu', cls:'pill-ok', dl:dl, sub:sub} : {code:'late', label:'Terlambat', cls:'pill-bad', dl:dl, sub:sub};
  if(docExists) return {code:'legacy', label:'Tanpa catatan waktu', cls:'pill-warn', dl:dl, sub:null};
  return new Date()>dl ? {code:'missing-late', label:'Belum lapor — lewat batas', cls:'pill-bad', dl:dl, sub:null}
                       : {code:'pending', label:'Belum lapor', cls:'pill-warn', dl:dl, sub:null};
}
function deadlineBannerHtml(period, submittedAt, docExists){
  const t = timelinessInfo(period, submittedAt, docExists);
  if(!t.dl) return '';
  const dlTxt = fmtDateID(t.dl);
  const perTxt = /^\d{4}$/.test(String(period)) ? 'tahun '+period : periodLabel(period);
  let html, bg='var(--paper-raised)', fg='var(--ink)', bd='var(--line)';
  if(t.sub){
    html = `Batas pengisian ${perTxt}: <strong>${dlTxt}</strong>. Pertama kali dikirim: ${fmtDateID(t.sub)} — <span class="pill ${t.cls}">${t.label}</span>`;
  } else if(t.code==='legacy'){
    html = `Batas pengisian ${perTxt}: <strong>${dlTxt}</strong>. Data ini tersimpan sebelum pencatatan waktu diaktifkan.`;
  } else if(new Date()>t.dl){
    html = `⚠ Batas pengisian ${perTxt} (<strong>${dlTxt}</strong>) sudah lewat. Data yang dikirim sekarang akan tercatat <strong>TERLAMBAT</strong>.`;
    bg='var(--rust-mist)'; fg='var(--rust)'; bd='var(--rust)';
  } else {
    const days = Math.ceil((t.dl - new Date())/86400000);
    html = `Batas pengisian ${perTxt}: <strong>${dlTxt}</strong> (sisa ${days} hari).`;
    bg='var(--teal-mist)'; fg='var(--teal-deep)'; bd='var(--teal)';
  }
  return `<div class="no-print" style="margin-bottom:14px; padding:10px 14px; border-radius:8px; font-size:13px; background:${bg}; color:${fg}; border:1px solid ${bd};">${html}</div>`;
}

}

/* ---------- Upload bukti dukung (semua jenis file, banyak file, folder per fasilitas) ---------- */
function guessMime(file){
  if(file.type) return file.type;
  const ext = (String(file.name).split('.').pop()||'').toLowerCase();
  return MIME_BY_EXT[ext] || 'application/octet-stream';
}
function fileToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
}
async function compressImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{
    const bmp = await createImageBitmap(file);
    const maxDim = 1600; const scale = Math.min(1, maxDim/Math.max(bmp.width, bmp.height));
    if(scale===1 && file.size < 1.5*1024*1024){ if(bmp.close) bmp.close(); return file; }
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width*scale); canvas.height = Math.round(bmp.height*scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    if(bmp.close) bmp.close();
    const blob = await new Promise(res=>canvas.toBlob(res, 'image/jpeg', 0.8));
    if(blob && blob.size < file.size){ return new File([blob], file.name.replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'}); }
    return file;
  }catch(e){ return file; }
}
function facilityFolderLabel(facilityId){
  const f = STATE.facilities.find(x=>x.id===facilityId);
  if(!f) return 'Faskes-'+facilityId;
  const t = facilityTypeLabel(f.type);
  return (t ? t+' ' : '')+f.name;
}
function buildUploadMeta(facilityId, moduleName, period, label){
  return {folderPath:[facilityFolderLabel(facilityId), moduleName, period||currentPeriod()], label:String(label||'').replace(/[^\w\- ]+/g,'').trim().substring(0,30)};
}
/* Sebagian sistem lain (SIMPUS, dsb.) "mengekspor Excel" dengan menyimpan tabel HTML biasa
   diberi nama .xls/.xlsx. Google Sheets memaksa membacanya sebagai file Excel asli sehingga
   tampil berantakan. Kalau terdeteksi, ganti jadi .html supaya terbuka rapi sebagai halaman web. */
async function fixMislabeledHtmlFile(file){
  if(!/\.(xlsx?|csv)$/i.test(file.name)) return file;
  try{
    const head = await file.slice(0, 400).text();
    if(/^\s*(<!doctype html|<html|<table)/i.test(head)){
      const newName = file.name.replace(/\.(xlsx?|csv)$/i, '') + '.html';
      return new File([file], newName, {type:'text/html'});
    }
  }catch(e){ /* abaikan, unggah apa adanya */ }
  return file;
}
async function uploadFiles(fileList, meta, statusEl){
  if(__uploadBusy){ toast('Masih ada unggahan yang berjalan, mohon tunggu.', 'error'); return null; }
  __uploadBusy = true;
  const files = Array.from(fileList); const out = [];
  try{
    for(let i=0;i<files.length;i++){
      let f = files[i];
      if(statusEl) statusEl.textContent = 'Mengunggah '+(i+1)+'/'+files.length+': '+f.name+' …';
      f = await compressImage(f);
      f = await fixMislabeledHtmlFile(f);
      if(f.size > MAX_UPLOAD_BYTES){ toast('File "'+f.name+'" melebihi batas 10MB.', 'error'); if(statusEl) statusEl.textContent=''; return null; }
      const base64 = await fileToBase64(f);
      const resp = await fetch(UPLOAD_SCRIPT_URL, {method:'POST', body: JSON.stringify({fileBase64:base64, fileName:f.name, mimeType:guessMime(f), folderPath:meta.folderPath, filePrefix:meta.label||''})});
      const data = await resp.json();
      if(!data.success) throw new Error(data.error || 'Upload gagal');

function verifState(entry, num, den, nFiles){
  if(!entry || !entry.status || entry.status==='Belum Diverifikasi') return {code:'none', badge:verifikasiBadgeHtml('Belum Diverifikasi'), catatan:(entry&&entry.catatan)||''};
  const s = entry.snap;
  const stale = s && (Number(s.num)!==Number(num||0) || Number(s.den)!==Number(den||0) || Number(s.files)!==Number(nFiles||0));
  if(stale) return {code:'stale', badge:'<span class="pill pill-warn">Perlu verifikasi ulang</span>', catatan:((entry.catatan||'')+' (data/bukti berubah setelah verifikasi)').trim()};
  if(entry.status==='Terverifikasi') return {code:'ok', badge:verifikasiBadgeHtml('Terverifikasi'), catatan:entry.catatan||''};
  return {code:'clarify', badge:verifikasiBadgeHtml('Perlu Klarifikasi'), catatan:entry.catatan||''};
}

async function saveFacInm(facilityId, period){
  const el = document.getElementById('fac-inm-body');
  const indicators = {}; let anyData = false;
  for(const ind of INM){
    const num = Number(el.querySelector(`[data-inm-num="${ind.id}"]`).value)||0;
    const den = Number(el.querySelector(`[data-inm-den="${ind.id}"]`).value)||0;
    if(num>den){ toast('Numerator tidak boleh melebihi denominator ('+ind.short+').', 'error'); return; }
    if(den>0) anyData = true;
    indicators[ind.id] = {num, den};
  }
  if(!anyData){ toast('Isi minimal satu indikator (denominator lebih dari 0).', 'error'); return; }
  setSaveBusy('inm-save-btn', true, 'Simpan Data INM');
  try{
    const docRef = db.collection('inm_reports').doc(facilityId+'_'+period);
    const existing = await docRef.get();
    const oldBukti = existing.exists ? ((existing.data().bukti)||{}) : {};
    const newBukti = {}; let hasNew = false;
    const statusEl = document.getElementById('inm-upload-status');
    for(const ind of INM){
      const input = document.getElementById('inm-file-'+ind.id);
      if(input && input.files.length){
        const res = await uploadFiles(input.files, buildUploadMeta(facilityId, 'INM', period, ind.short), statusEl);
        if(!res){ setSaveBusy('inm-save-btn', false, 'Simpan Data INM'); return; }
        newBukti[ind.id] = (oldBukti[ind.id]||[]).concat(res); hasNew = true;
      }
    }
    const payload = {facilityId, period, indicators, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: STATE.user.uid};
    if(!existing.exists || !existing.data().submittedAt) payload.submittedAt = firebase.firestore.FieldValue.serverTimestamp();
    if(hasNew) payload.bukti = Object.assign({}, oldBukti, newBukti);
    await docRef.set(payload, {merge:true});
    toast('Data INM tersimpan.');
    loadFacInm(facilityId, period);
  }catch(e){
    toast('Gagal menyimpan: '+e.message, 'error');
    setSaveBusy('inm-save-btn', false, 'Simpan Data INM');
  }
}

function inmRowSummary(r, period){
  const ind = (r.data && r.data.indicators) || {}, bukti = (r.data && r.data.bukti) || {}, verif = (r.data && r.data.verifikasi) || {};
  let withData=0, withBukti=0, ok=0, clar=0, stale=0;
  inmEffectiveIndicators(period||currentPeriod()).forEach(i=>{
    const v = ind[i.id];
    if(v && Number(v.den)>0){
      withData++; const nf = (bukti[i.id]||[]).length; if(nf>0) withBukti++;
      const vs = verifState(verif[i.id], v.num, v.den, nf);
      if(vs.code==='ok') ok++; else if(vs.code==='clarify') clar++; else if(vs.code==='stale') stale++;
    }
  });
  return {withData, withBukti, ok, clar, stale};
}

/* ---------- Ringkasan & Kepatuhan Pelaporan (dengan ketepatan waktu) ---------- */
async function loadRingkasan(){
  ringkasanLoading = true;
  const facs = STATE.facilities.filter(f=>f.active!==false);
  const results = await Promise.all(facs.map(async f=>{
    const doc = await db.collection('inm_reports').doc(f.id+'_'+STATE.period).get();
    const data = doc.exists ? doc.data() : null;
    const values = {}; let reportedCount = 0;
    INM.forEach(ind=>{
      const v = data && data.indicators && data.indicators[ind.id];
      values[ind.id] = v ? pct(v.num, v.den) : null;
      if(v && Number(v.den)>0 && (!isSemesterIndicator(ind.id) || isSemesterMonth(STATE.period))) reportedCount++;
    });
    return {facilityId:f.id, name:f.name, values, reportedCount, exists:doc.exists, submittedAt:data&&data.submittedAt};
  }));
  ringkasanData = results; ringkasanLoading = false;
  if(STATE.dinkesTab==='ringkasan' || STATE.dinkesTab==='kepatuhan' || STATE.dinkesTab==='analisis') renderDinkesShell();
}

async function savePmpReport(facilityId, period, level){
  level = level || 'unit';
  const el = document.getElementById('pmp-fac-body');
  const values = {}; let anyData = false; const ids = [];
  const numEls = el.querySelectorAll('[data-pmp-num]');
  for(const inp of numEls){
    const id = inp.getAttribute('data-pmp-num');
    const num = Number(inp.value)||0, den = Number(el.querySelector(`[data-pmp-den="${id}"]`).value)||0;
    const nm = (document.getElementById('pmp-name-'+id)||{}).textContent||'indikator';
    if(num>den){ toast('Numerator tidak boleh melebihi denominator ('+nm+').', 'error'); return; }
    if(den>0) anyData = true;
    values[id] = {num, den}; ids.push(id);
  }
  if(!anyData){ toast('Isi minimal satu indikator (denominator lebih dari 0).', 'error'); return; }
  setSaveBusy('pmp-save-btn', true, 'Simpan Data PMP');
  try{
    const docRef = db.collection('pmp_reports').doc(facilityId+'_'+period);
    const existing = await docRef.get();
    const oldBukti = existing.exists ? ((existing.data().bukti)||{}) : {};
    const newBukti = {}; let hasNew = false;
    const statusEl = document.getElementById('pmp-upload-status');
    const moduleName = level==='unit' ? 'PMP-Unit' : 'PMP-Puskesmas-Klinik';
    for(const id of ids){
      const input = document.getElementById('pmp-file-'+id);
      if(input && input.files.length){
        const nm = (document.getElementById('pmp-name-'+id)||{}).textContent||'indikator';
        const res = await uploadFiles(input.files, buildUploadMeta(facilityId, moduleName, period, nm), statusEl);
        if(!res){ setSaveBusy('pmp-save-btn', false, 'Simpan Data PMP'); return; }
        newBukti[id] = (oldBukti[id]||[]).concat(res); hasNew = true;
      }
    }
    const payload = {facilityId, period, level, values, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: STATE.user.uid};
    if(!existing.exists || !existing.data().submittedAt) payload.submittedAt = firebase.firestore.FieldValue.serverTimestamp();
    if(hasNew) payload.bukti = Object.assign({}, oldBukti, newBukti);
    await docRef.set(payload, {merge:true});
    toast('Data PMP tersimpan.');
    loadPmpForFacility(facilityId, period, 'pmp-fac-body', true, level);
  }catch(e){
    toast('Gagal menyimpan: '+e.message, 'error');
    setSaveBusy('pmp-save-btn', false, 'Simpan Data PMP');
  }
}

const MODUL_LABEL = {ikp_reports:'IKP', ppi_pajanan:'PPI — Laporan Pajanan', ppi_checklist:'PPI — Daftar Tilik', ppi_audit:'PPI — Audit Kualitas', ppi_icra:'PPI — ICRA',

  mfk_register:'MFK — Register Risiko', k3_pemetaan:'K3 — Pemetaan', k3_perencanaan:'K3 — Perencanaan', k3_b3:'K3 — Inventaris B3', inm_reports:'INM', pmp_reports:'Indikator Mutu Prioritas', pmp_rtl:'RTL Indikator Mutu Prioritas'};
const BUKTI_MODULE_BY_COLLECTION = {ikp_reports:'IKP', ppi_pajanan:'PPI-Laporan-Pajanan', ppi_checklist:'PPI-Daftar-Tilik', ppi_audit:'PPI-Audit-Kualitas', ppi_icra:'PPI-ICRA',

function recordSummary(collection, d){
  const cut = (s,n)=>String(s||'').substring(0,n);
  const m = {
    ikp_reports: x=>[x.tanggal, x.unit, cut(x.deskripsi,60)], ppi_pajanan: x=>[x.tanggalLaporan, x.nama], ppi_checklist: x=>[x.period, x.ruang],
    ppi_audit: x=>[x.tanggal, x.ruang], ppi_icra: x=>[x.uraian, 'Skor '+x.score], audit_form1: x=>[x.tanggal, cut(x.indikator,60)], audit_temuan: x=>[x.tanggal, cut(x.temuan,60)],
    risk_register: x=>[x.kodeRisiko, cut(x.risiko,60)], risk_profil: x=>[x.kodeRisiko, cut(x.risikoPrioritas,60)], risk_pemantauan: x=>[x.kodeRisiko, x.trendRisiko],
    mfk_register: x=>[x.unitKerja, cut(x.risiko,60)], k3_pemetaan: x=>[x.klaster, x.ruangPelayanan], k3_perencanaan: x=>[x.klaster, cut(x.kegiatan,60)],
    k3_b3: x=>[x.bulan, x.namaBahan], inm_reports: x=>['Periode '+x.period], pmp_reports: x=>['Periode '+x.period+(x.level==='fasyankes'?' (Tahunan)':'')],
    pmp_rtl: x=>[x.indicatorName, cut(x.kegiatan,60)]
  };
  const f = m[collection];
  return (f ? f(d) : [collection]).filter(Boolean).join(' — ');
}

async function submitPmpRtl(facilityId, indicatorId, indicatorName){

function deletionLogData(collection, id, d, alasan){
  const snapshot = JSON.stringify(d, (k,v)=> (v && typeof v.toDate==='function') ? v.toDate().toISOString() : v).substring(0,60000);
  const p = STATE.profile || {};
  return {facilityId:d.facilityId||null, collection, docId:id, modul:MODUL_LABEL[collection]||collection, ringkasan:recordSummary(collection,d), snapshot, alasan,
    deletedBy:p.name||p.email||(STATE.user&&STATE.user.email)||'', deletedByUid:STATE.user.uid, deletedByRole:p.role||'',
    deletedAt:firebase.firestore.FieldValue.serverTimestamp()};
}
function lockedForFacility(collection, d){
  if(collection==='inm_reports' || collection==='pmp_reports') return !!d.verifiedBy;
  return d.statusVerifikasi==='Terverifikasi';
}
async function deleteRecordWithLog(collection, id, reloadFn){
  try{
    const ref = db.collection(collection).doc(id);
    const snap = await ref.get();
    if(!snap.exists){ toast('Data sudah tidak ada.', 'error'); if(reloadFn) reloadFn(); return; }
    const d = snap.data();
    const isDinkesUser = STATE.profile && STATE.profile.role==='dinkes';
    if(!isDinkesUser && lockedForFacility(collection, d)){
      toast('Data ini sudah ditinjau/diverifikasi Dinkes sehingga tidak bisa dihapus oleh fasilitas. Perbaiki datanya, atau hubungi Dinkes bila perlu dihapus.', 'error');
      return;
    }
    const alasan = prompt('Alasan penghapusan (wajib diisi, mis. "salah input periode"):');
    if(!alasan || !alasan.trim()) return;
    if(!confirm('Yakin menghapus data ini?\n\nPenghapusan dicatat di log dan tidak dapat dibatalkan.')) return;
    const batch = db.batch();
    batch.set(db.collection('deletion_log').doc(), deletionLogData(collection, id, d, alasan.trim()));
    batch.delete(ref);
    await batch.commit();
    toast('Data dihapus.');
    if(reloadFn) reloadFn();
  }catch(e){ toast('Gagal menghapus: '+e.message, 'error'); }
}

      <div style="margin-bottom:12px;">${files.length ? files.map((f,i)=>`<div style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:4px;">

      </div>`);

}
async function removeRecordBukti(collection, docId, idx){
  if(!confirm('Hapus file ini dari daftar bukti dukung? (Berkas asli tetap tersimpan di Google Drive sebagai arsip.)')) return;
  try{
    const ref = db.collection(collection).doc(docId);
    const snap = await ref.get();
    const next = buktiFilesOf(snap.data()).filter((_,i)=>i!==idx);
    await ref.update(evidencePatch(next));
    toast('File dihapus dari daftar.'); renderFacilityShell(); openBuktiManager(collection, docId);
  }catch(e){ toast('Gagal menghapus: '+e.message, 'error'); }
}
async function addRecordBukti(collection, docId){
  const input = document.getElementById('bm-file');
  if(!input || !input.files.length){ toast('Pilih file terlebih dahulu.', 'error'); return; }
  try{
    const ref = db.collection(collection).doc(docId);
    const snap = await ref.get(); const d = snap.data();
    const fid = d.facilityId || (STATE.profile && STATE.profile.facilityId);
    const files = await uploadFiles(input.files, buildUploadMeta(fid, BUKTI_MODULE_BY_COLLECTION[collection]||collection, currentPeriod(), ''), document.getElementById('bm-status'));
    if(!files) return;
    await ref.update(evidencePatch(buktiFilesOf(d).concat(files)));
    toast('Bukti dukung ditambahkan.'); renderFacilityShell(); openBuktiManager(collection, docId);
  }catch(e){ toast('Gagal menyimpan: '+e.message, 'error'); }
}

/* Log Penghapusan (Dinkes) */
let deletionLogCache = null;
async function loadDeletionLog(){
  try{
    const snap = await db.collection('deletion_log').orderBy('deletedAt','desc').limit(300).get();
    deletionLogCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){ deletionLogCache = []; toast('Gagal memuat log: '+e.message, 'error'); }
  if(STATE.dinkesTab==='log') renderDinkesShell();
}
function viewLog(){
  if(!deletionLogCache) loadDeletionLog();
  const facName = id => (STATE.facilities.find(f=>f.id===id)||{}).name || '—';
  const rows = (deletionLogCache||[]).map(l=>{
    const dt = tsToDate(l.deletedAt);
    const when = dt ? fmtDateID(dt)+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0') : '—';
    return `<tr><td>${when}</td><td style="font-weight:600;">${esc(facName(l.facilityId))}</td><td>${esc(l.modul||l.collection)}</td>

    </div>
    ${printExportToolbar('Log Penghapusan Data', '', '#log-table', 'Log_Penghapusan.xlsx', null, null)}`;
  return ['Log Penghapusan Data', 'Riwayat data yang dihapus beserta alasan', content];
}

function anF(modul, level, judul, analisis, penyebab, rtl){ return {modul, level, judul, analisis, penyebab:penyebab||[], rtl:rtl||[]}; }
function anA(k, pj, hari, ukuran){ return {k, pj, hari, ukuran}; }
function anSel(x){ return String(Math.round(Math.abs(x)*100)/100); }
function anP2(n){ return String(n).padStart(2,'0'); }
function anAddDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return d; }
function anWindow(period){
  const parts = period.split('-').map(Number), y = parts[0], m = parts[1];
  const s = new Date(y, m-3, 1), e = new Date(y, m, 0);
  const sp = s.getFullYear()+'-'+anP2(s.getMonth()+1);
  return {startPeriod:sp, endPeriod:period, start:sp+'-01', end:y+'-'+anP2(m)+'-'+anP2(e.getDate())};
}
function anPrevPeriods(period, n){
  const parts = period.split('-').map(Number), y = parts[0], m = parts[1], out = [];
  for(let i=1;i<=n;i++){ const d = new Date(y, m-1-i, 1); out.push(d.getFullYear()+'-'+anP2(d.getMonth()+1)); }
  return out;
}
function anTrend(p, prev){
  if(!prev) return '';
  const d = p - prev.p;
  if(Math.abs(d)<1) return ' Dibanding '+periodLabel(prev.period)+' ('+fmtPct(prev.p)+') relatif tetap.';
  return ' Dibanding '+periodLabel(prev.period)+' ('+fmtPct(prev.p)+') '+(d>0?'naik ':'turun ')+anSel(d)+' poin.';
}
function anTop(list, n){ return list.slice(0,n); }

/* ---------- INM ---------- */
function analyzeInm(d){
  const out = [], stats = {filled:0, achieved:0, below:[]};
  const cur = d.inm.cur || null, period = d.period;
  inmEffectiveIndicators(period).forEach(ind=>{
    const kb = INM_KB[ind.id], t = getTarget(ind.id);
    const v = cur && cur.indicators && cur.indicators[ind.id];
    const den = Number(v&&v.den)||0, num = Number(v&&v.num)||0;
    if(den<=0){
      out.push(anF('INM','mid', ind.short+': data belum diisi', 'Numerator/denominator "'+ind.name+'" belum diisi untuk '+periodLabel(period)+', sehingga capaian belum dapat dianalisis.', [],
        [anA('Lengkapi input "'+ind.name+'" periode '+periodLabel(period)+' pada menu Input INM','PJ Mutu',3,'Data terisi dan tersimpan')]));
      return;
    }
    stats.filled++;
    const p = pct(num, den);
    const prevs = (d.inm.prev||[]).map(x=>{ const pv = x.data && x.data.indicators && x.data.indicators[ind.id]; return pv && Number(pv.den)>0 ? {period:x.period, p:pct(pv.num,pv.den)} : null; }).filter(Boolean);
    let level = p>=t ? 'ok' : (p>=t*0.85 ? 'mid' : 'high');
    let text = 'Capaian '+fmtPct(p)+' ('+num+' dari '+den+') '+(p>=t?'telah mencapai':'belum mencapai')+' target '+t+'%'+(p<t?' — selisih '+anSel(t-p)+' poin':'')+'.';
    text += anTrend(p, prevs[0]);
    const chronic = p<t && prevs.length>=2 && prevs[0].p<t && prevs[1].p<t;
    const declining = p>=t && prevs[0] && (p-prevs[0].p)<=-5;
    if(chronic){ text += ' Capaian di bawah target selama 3 bulan berturut-turut, sehingga perlu ditangani sebagai masalah sistemik, bukan kejadian sesaat.'; level = 'high'; }
    if(declining){ text += ' Capaian menurun cukup tajam meskipun masih memenuhi target — waspadai penurunan berlanjut.'; level = 'mid'; }
    if(den < (INM_MIN_DEN[ind.id]||10)) text += ' Catatan: jumlah data (denominator '+den+') masih kecil sehingga persentase mudah berubah oleh satu kejadian; perkuat pengumpulan data/sampel.';
    let rtl = [];
    if(p>=t){
      rtl = kb.pertahankan.map(a=>anA(a[0],a[1],a[2],a[3]));
      if(declining) rtl.push(anA('Telusuri penyebab penurunan capaian '+ind.short+' (unit/shift/petugas) dan koreksi lebih awal','PJ Mutu',14,'Penyebab teridentifikasi; capaian kembali naik'));
    } else {
      rtl = kb.rtl.filter(a=>a[4]==='mid' || level==='high').map(a=>anA(a[0],a[1],a[2],a[3]));
      stats.below.push({short:ind.short, p, t, gap:t-p});
    }
    if(p>=t) stats.achieved++;
    const files = (((cur.bukti||{})[ind.id])||[]).length;
    if(files===0){ text += ' Bukti dukung belum diunggah.'; rtl.push(anA('Unggah bukti dukung '+ind.short+' (register/rekap observasi/dokumen sumber) agar dapat diverifikasi Dinkes','PJ Mutu',7,'Bukti terunggah')); }
    const vs = verifState(((cur.verifikasi||{})[ind.id]), num, den, files);
    if(vs.code==='clarify'){
      text += ' Dinkes meminta klarifikasi'+(vs.catatan?': "'+vs.catatan+'"':'')+'.';
      if(level==='ok') level = 'mid';
      rtl.push(anA('Tindak lanjuti permintaan klarifikasi Dinkes untuk '+ind.short+' (perbaiki data/bukti lalu simpan ulang)','PJ Mutu',7,'Status verifikasi menjadi terverifikasi'));
    }
    out.push(anF('INM', level, ind.short+': '+fmtPct(p)+' (target '+t+'%)', text, p<t ? kb.penyebab : [], rtl));
  });
  return {findings:out, stats};
}

/* ---------- PMP ---------- */
function anGenericIndicator(modul, name, target, cur, prev, prevLabel, perLbl, chronicPrevs, annual){
  const den = Number(cur&&cur.den)||0, num = Number(cur&&cur.num)||0;
  if(den<=0) return anF(modul,'mid', name+': data belum diisi', 'Capaian indikator "'+name+'" belum diisi untuk '+perLbl+'.', [], [anA('Lengkapi input capaian "'+name+'" pada menu Input PMP','PJ Mutu / kepala unit',5,'Data terisi dan tersimpan')]);
  const p = pct(num, den);
  let level = p>=target ? 'ok' : (p>=target*0.85 ? 'mid' : 'high');
  let text = 'Capaian '+fmtPct(p)+' ('+num+' dari '+den+') '+(p>=target?'telah mencapai':'belum mencapai')+' target '+target+'%'+(p<target?' — selisih '+anSel(target-p)+' poin':'')+'.';
  if(prev){ const dd = p-prev.p; text += ' Dibanding '+prevLabel+' ('+fmtPct(prev.p)+') '+(Math.abs(dd)<1?'relatif tetap':(dd>0?'naik ':'turun ')+anSel(dd)+' poin')+'.'; }
  const chronic = p<target && chronicPrevs && chronicPrevs.length>=2 && chronicPrevs.every(x=>x<target);
  if(chronic){ text += ' Capaian di bawah target pada beberapa periode berturut-turut — indikasi masalah sistemik.'; level = 'high'; }
  let rtl;
  if(p>=target){
    rtl = [anA('Pertahankan pelaksanaan yang sudah baik dan dokumentasikan praktik baiknya','Kepala unit / PJ Mutu',30,'Capaian tetap ≥ target')];
    if(chronicPrevs && chronicPrevs.length>=2 && chronicPrevs.every(x=>x>=target)) { text += ' Target telah tercapai beberapa periode berturut-turut.'; rtl.push(anA('Pertimbangkan menaikkan target atau mengganti indikator dengan isu mutu lain yang lebih prioritas','PJ Mutu + kepala unit',30,'Keputusan penyesuaian target/indikator')); }
  } else {
    rtl = PMP_RTL_BASE.filter(a=>a[4]==='mid' || level==='high').map(a=>anA(a[0],a[1],a[2],a[3]));
    if(annual) rtl.push(anA('Evaluasi capaian tahunan pada rapat tinjauan manajemen dan jadikan dasar penyusunan prioritas mutu tahun berikutnya','Kepala Puskesmas/Klinik + Tim Mutu',60,'Prioritas mutu tahun berikutnya ditetapkan'));
  }
  return anF(modul, level, name+': '+fmtPct(p)+' (target '+target+'%)', text, p<target ? ['Periksa definisi operasional dan cara pengumpulan data','Periksa kepatuhan terhadap SOP di unit terkait','Periksa ketersediaan sarana dan SDM','Periksa alur pelayanan dan beban kerja','Periksa apakah umpan balik hasil capaian sudah disampaikan ke petugas'] : [], rtl);
}
function analyzePmp(d){
  const out = [], items = (d.pmp.items||[]).filter(it=>it.active!==false);
  const period = d.period, year = String(period).split('-')[0];
  const unitItems = items.filter(it=>(it.level||'unit')==='unit'), fasItems = items.filter(it=>it.level==='fasyankes');
  if(unitItems.length===0){
    out.push(anF('Indikator Mutu Prioritas Pelayanan','info','Mutu Prioritas Unit belum didefinisikan','Belum ada indikator Mutu Prioritas Unit yang ditetapkan.',[],[anA('Tetapkan minimal satu indikator mutu prioritas untuk tiap unit berdasarkan masalah mutu terbesar di unit tersebut (menu Input PMP > Kelola Indikator Lokal)','PJ Mutu + kepala unit',30,'Indikator mutu prioritas unit terdaftar')]));
  } else {
    const cur = d.pmp.unitCur;
    unitItems.forEach(it=>{
      const nm = (it.unitName?'['+it.unitName+'] ':'')+it.name;
      const curV = cur && cur.values && cur.values[it.id];
      const prevs = (d.pmp.unitPrev||[]).map(x=>{ const v = x.data && x.data.values && x.data.values[it.id]; return v && Number(v.den)>0 ? {period:x.period, p:pct(v.num,v.den)} : null; }).filter(Boolean);
      const tg = it.target!=null ? Number(it.target) : 100;
      out.push(anGenericIndicator('Indikator Mutu Prioritas Pelayanan', nm, tg, curV, prevs[0], prevs[0]?periodLabel(prevs[0].period):'', periodLabel(period), prevs.slice(0,2).map(x=>x.p), false));
    });
  }
  if(fasItems.length===0){
    out.push(anF('Indikator Mutu Prioritas Puskesmas','info','Mutu Prioritas Puskesmas/Klinik belum didefinisikan','Belum ada indikator Mutu Prioritas Puskesmas/Klinik untuk tahun '+year+'.',[],[anA('Susun indikator Mutu Prioritas Puskesmas/Klinik tahun '+year+' berdasarkan analisis masalah mutu dan hasil INM (menu Input PMP > tab Tahunan)','Kepala Puskesmas/Klinik + Tim Mutu',30,'Dokumen mutu prioritas tahunan tersusun')]));
  } else {
    const cur = d.pmp.fasCur, prevDoc = d.pmp.fasPrev;
    const tl = timelinessInfo(year, cur && cur.submittedAt, !!cur);
    fasItems.forEach(it=>{
      const curV = cur && cur.values && cur.values[it.id];
      const pv = prevDoc && prevDoc.values && prevDoc.values[it.id];
      const prev = pv && Number(pv.den)>0 ? {p:pct(pv.num,pv.den)} : null;
      const tg = it.target!=null ? Number(it.target) : 100;
      if(!(Number(curV&&curV.den)>0)){
        out.push(anF('Indikator Mutu Prioritas Puskesmas', tl.code==='missing-late'?'mid':'info', it.name+': capaian tahun '+year+' belum diisi',
          'Capaian tahunan indikator "'+it.name+'" belum diisi.'+(tl.dl?' Batas pengisian: '+fmtDateID(tl.dl)+'.':''), [],
          [anA('Isi capaian tahunan "'+it.name+'" pada menu Input PMP tab Tahunan sebelum batas waktu','PJ Mutu',14,'Capaian tahunan terisi')]));
      } else {
        out.push(anGenericIndicator('Indikator Mutu Prioritas Puskesmas', it.name, tg, curV, prev, 'tahun '+(Number(year)-1), 'tahun '+year, [], true));
      }
    });
  }
  return out;
}

  if(inc.length===0){
    out.push(anF('IKP','info','Tidak ada insiden dilaporkan ('+rng+')','Tidak ada laporan insiden keselamatan pasien pada '+rng+'. Ini tidak selalu berarti tidak ada kejadian — sering kali budaya pelaporan belum berjalan.',[],
      [anA('Sosialisasikan budaya pelaporan insiden tanpa menyalahkan (blame-free) dan mudahkan akses formulir pelaporan','PJ Mutu',14,'Petugas memahami alur dan berani melapor'),
       anA('Lakukan identifikasi proaktif (telusur/walk-through) untuk menemukan kejadian nyaris cedera yang belum dilaporkan','Tim Mutu',30,'Laporan KNC/KPC meningkat')]));
    return out;
  }
  const code = x=>String(x.jenis||'').split(/\s|—/)[0];

  const high = inc.filter(x=>x.grading==='High'||x.grading==='Extreme');
